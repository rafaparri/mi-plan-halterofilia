<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mi Plan · Halterofilia</title>
<link rel="apple-touch-icon" href="static/apple-touch-icon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --bg:#f5f5f2;
  --surface:#ffffff;
  --surface-2:#eef0f4;
  --surface-3:#c9d3de;
  --chalk:#20242e;
  --muted:#57616e;
  --muted-2:#7d8794;
  --red:#c14a3a;
  --blue:#3f6f9f;
  --yellow:#f4dd8a;
  --yellow-deep:#c99a2e;
  --ok:#2f7dc4;
  --purple:#7d6bb0;
  --rest:#ab9c86;
  --border:#dfe3e8;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--chalk);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:640px;margin:0 auto;padding:0 0 60px;}

/* ---------- Upload screen ---------- */
.upload-screen{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:32px 20px;
  text-align:center;
}
.upload-mark{
  width:72px;height:72px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%, #eef1f6, var(--surface) 70%);
  border:3px solid var(--surface-3);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:22px;
  position:relative;
}
.upload-mark::before{
  content:"";
  width:26px;height:26px;
  border:3px solid var(--yellow);
  border-radius:50%;
  border-right-color:transparent;
  border-bottom-color:transparent;
  transform:rotate(45deg);
}
h1.brand{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:28px;
  letter-spacing:0.02em;
  text-transform:uppercase;
  margin:0 0 6px;
}
p.tagline{
  color:var(--muted);
  font-size:14px;
  margin:0 0 34px;
  max-width:320px;
  line-height:1.5;
}
.dropzone{
  width:100%;
  max-width:340px;
  border:2px dashed var(--surface-3);
  border-radius:16px;
  padding:30px 20px;
  cursor:pointer;
  transition:border-color .15s ease, background .15s ease;
  background:var(--surface);
}
.dropzone:hover, .dropzone.drag{
  border-color:var(--yellow);
  background:var(--surface-2);
}
.dropzone .dz-title{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:16px;
  text-transform:uppercase;
  letter-spacing:.03em;
  margin-bottom:6px;
}
.dropzone .dz-sub{color:var(--muted-2);font-size:12.5px;}
input[type=file]{display:none;}
.upload-error{
  margin-top:18px;
  color:var(--red);
  font-size:13px;
  max-width:340px;
  line-height:1.5;
}
.history-pick{
  margin-top:28px;
  font-size:13px;
  color:var(--muted);
}
.history-pick button{
  background:none;border:none;color:var(--yellow-deep);
  font-size:13px;font-family:'Inter',sans-serif;font-weight:600;
  cursor:pointer;text-decoration:underline;padding:0;
}

/* ---------- Header ---------- */
.topbar{
  padding:22px 20px 16px;
  border-bottom:1px solid var(--border);
  position:sticky;top:0;
  background:rgba(246,249,239,0.94);
  backdrop-filter:blur(6px);
  z-index:20;
}
.topbar-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.athlete-name{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:22px;
  text-transform:uppercase;
  letter-spacing:.01em;
  line-height:1.1;
}
.meta-line{
  color:var(--muted);
  font-size:12.5px;
  margin-top:4px;
  font-family:'IBM Plex Mono',monospace;
}
.week-chip{
  background:var(--yellow);
  color:#26330f;
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:12.5px;
  padding:5px 10px;
  border-radius:20px;
  white-space:nowrap;
  text-transform:uppercase;
}
.topbar-actions{
  display:flex;gap:10px;margin-top:12px;
}
.tb-btn{
  background:none;border:1px solid var(--surface-3);color:var(--muted);
  font-size:11.5px;font-family:'Inter',sans-serif;font-weight:600;
  padding:6px 11px;border-radius:8px;cursor:pointer;
  text-transform:uppercase;letter-spacing:.03em;
}
.tb-btn:hover{border-color:var(--muted);color:var(--chalk);}

/* ---------- Day plate selector ---------- */
.plate-row{
  display:flex;
  gap:14px;
  padding:20px 20px 6px;
  overflow-x:auto;
  scrollbar-width:none;
}
.plate-row::-webkit-scrollbar{display:none;}
.plate-wrap{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  flex-shrink:0;cursor:pointer;
  background:none;border:none;color:inherit;
  font-family:inherit;
}
.plate{
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;
  font-weight:700;
  position:relative;
  transition:transform .15s ease;
}
.plate-wrap:active .plate{transform:scale(0.94);}
.plate-wrap.active .plate{
  box-shadow:0 0 0 3px var(--bg), 0 0 0 5px var(--chalk);
}
.plate-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
.plate-wrap.active .plate-label{color:var(--chalk);font-weight:700;}
.plate-progress{
  position:absolute;inset:-4px;
  border-radius:50%;
}

/* ---------- Day content ---------- */
.day-section{padding:8px 20px 0;}
.day-heading{
  display:flex;align-items:baseline;justify-content:space-between;
  margin:20px 0 14px;
}
.day-heading h2{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:19px;
  text-transform:uppercase;
  margin:0;
  letter-spacing:.01em;
}
.day-count{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;color:var(--muted-2);
}

.note-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-left:4px solid var(--rest);
  border-radius:12px;
  padding:18px 16px;
  margin-bottom:12px;
  font-family:'Oswald',sans-serif;
  text-transform:uppercase;
  letter-spacing:.03em;
  font-size:14px;
  color:var(--muted);
  text-align:center;
}
.note-card.competition{
  border-left-color:var(--red);
  color:var(--chalk);
  background:linear-gradient(135deg, rgba(193,74,58,0.12), var(--surface));

}

.empty-day{
  color:var(--muted-2);
  font-size:13px;
  text-align:center;
  padding:30px 0 10px;
  font-style:italic;
}

.ex-card{
  background:var(--surface);
  border:1px solid var(--border);

  padding:14px 14px 12px;
  margin-bottom:12px;

.ex-top{
  display:flex;align-items:flex-start;gap:10px;
}
.ex-code{
  flex-shrink:0;
  width:34px;height:34px;border-radius:50%;
  background:var(--surface-2);
  border:1.5px solid var(--surface-3);
  display:flex;align-items:center;justify-content:center;
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;font-size:12.5px;color:var(--muted);
}
.ex-info{flex:1;min-width:0;}
.ex-name{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:15.5px;
  text-transform:uppercase;
  letter-spacing:.01em;
  line-height:1.25;
}
.ex-name.unknown{color:var(--yellow-deep);}
.ex-sub{font-size:11px;color:var(--muted-2);margin-top:2px;text-transform:uppercase;letter-spacing:.03em;}

.set-chips{
  display:flex;flex-wrap:wrap;gap:7px;
  margin:12px 0 12px 44px;
}
.chip{
  background:var(--surface-2);
  border:1px solid var(--surface-3);
  border-radius:8px;
  padding:6px 9px;
  font-family:'IBM Plex Mono',monospace;
  font-size:12.5px;
  color:var(--chalk);
  white-space:nowrap;
  cursor:pointer;
  transition:background .12s ease, border-color .12s ease, color .12s ease;
}
.chip b{color:var(--yellow-deep);font-weight:600;}

.ex-hint{
  margin:2px 0 0 44px;
  font-size:10.5px;
  color:var(--muted-2);
  text-transform:uppercase;
  letter-spacing:.03em;
}
.ex-card{cursor:pointer;}

.ex-actions{
  display:flex;gap:8px;margin-left:44px;
}
.mark-btn{
  flex:1;
  border-radius:9px;
  border:1.5px solid var(--surface-3);
  background:var(--surface-2);
  color:var(--muted);
  padding:9px 0;
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:13px;
  cursor:pointer;
  letter-spacing:.02em;
  transition:all .12s ease;
}
.mark-btn.ok.selected{background:var(--ok);border-color:var(--ok);color:#0e1a0e;}
.mark-btn.bad.selected{background:var(--red);border-color:var(--red);color:#2a0e07;}

/* ---------- Flashcard overlay ---------- */
.fc-overlay{ padding:0; }
.fc-wrap{
  width:100%;max-width:440px;
  display:flex;flex-direction:column;
  height:min(680px, 94vh);
  background:var(--surface);
  border-radius:20px;
  overflow:hidden;
  border:1px solid var(--surface-3);
}
.fc-top{
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:18px 18px 10px;
  border-bottom:1px solid var(--border);
}
.fc-name{
  font-family:'Oswald',sans-serif;font-weight:700;font-size:20px;
  text-transform:uppercase;letter-spacing:.01em;
}
.fc-progress{
  font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--muted-2);margin-top:3px;
}
.fc-close{
  background:none;border:1px solid var(--surface-3);color:var(--muted);
  width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:16px;flex-shrink:0;
}
.fc-card-area{
  flex:1;display:flex;align-items:center;justify-content:center;padding:20px;
  touch-action:pan-y;
  position:relative;
  overflow:hidden;
  perspective:900px;
}
@keyframes fcPopIn{
  from{ opacity:0; transform:scale(.93); }
  to{ opacity:1; transform:scale(1); }
}
@keyframes fcSlideInNext{
  0%{ opacity:0; transform:translateX(120px) translateY(20px) rotate(13deg) scale(.9); }
  55%{ opacity:1; transform:translateX(-9px) translateY(-5px) rotate(-2deg) scale(1.02); }
  80%{ transform:translateX(3px) translateY(1px) rotate(.6deg) scale(.995); }
  100%{ opacity:1; transform:translateX(0) translateY(0) rotate(0deg) scale(1); }
}
@keyframes fcSlideInPrev{
  0%{ opacity:0; transform:translateX(-120px) translateY(20px) rotate(-13deg) scale(.9); }
  55%{ opacity:1; transform:translateX(9px) translateY(-5px) rotate(2deg) scale(1.02); }
  80%{ transform:translateX(-3px) translateY(1px) rotate(-.6deg) scale(.995); }
  100%{ opacity:1; transform:translateX(0) translateY(0) rotate(0deg) scale(1); }
}
.fc-card{
  width:100%;
  max-height:100%;
  overflow-y:auto;
  display:flex;flex-direction:column;align-items:center;gap:22px;
  padding:30px 20px;
  animation:fcPopIn .3s cubic-bezier(.22,.85,.32,1) both;
  will-change:transform,opacity;
}
.fc-card.dir-next{ animation:fcSlideInNext .4s cubic-bezier(.25,.8,.3,1) both; }
.fc-card.dir-prev{ animation:fcSlideInPrev .4s cubic-bezier(.25,.8,.3,1) both; }
.fc-mark:active, .mark-btn:active{ transform:scale(.96); }
.fc-nav-btn:active{ transform:scale(.88); }
.fc-memo-textarea{
  width:100%; margin-top:14px;
  background:var(--surface-2); border:1.5px solid var(--surface-3); border-radius:12px;
  color:var(--chalk); font-family:'Inter',sans-serif; font-size:16px; line-height:1.45;
  padding:14px; resize:vertical;
}
.fc-kg{
  font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(64px,17vw,88px);color:var(--yellow-deep);
  line-height:1;
}
.fc-setrep{
  font-family:'IBM Plex Mono',monospace;font-size:clamp(30px,8.5vw,42px);color:var(--chalk);
  font-weight:700;
  text-transform:uppercase;letter-spacing:.02em;
}
.fc-mark-row{ display:flex; gap:7px; width:100%; margin-top:12px; }
.fc-mark{
  flex:1;padding:12px 0;border-radius:12px;
  border:2px solid var(--surface-3);background:var(--surface-2);
  font-size:24px;line-height:1;
  cursor:pointer;transition:all .12s ease;

.fc-final{ text-align:center; }
.fc-final-title{

}
.fc-final-sub{ color:var(--muted); font-size:24px; margin-top:10px; font-weight:600; line-height:1.35; }
.fc-final-actions{ display:flex; gap:12px; width:100%; margin-top:24px; }

.fc-field{ display:flex; flex-direction:column; align-items:center; gap:6px; }

.fc-field-input{

.fc-nav{

}
.fc-nav-btn{

/* ---------- Debug ---------- */

}

/* ---------- History panel ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(10,10,12,0.7);
  display:flex;align-items:flex-end;justify-content:center;
  z-index:50;
}
.sheet{
  background:var(--surface);

</style>

<script>
/* ============== EXERCISE DICTIONARY (Comité Nacional de Entrenadores, RFEH) ============== */
const DICT = {
  1:"Arrancada", 2:"Arr. encima de la rodilla", 3:"Arr. debajo de la rodilla",
  4:"Arr. de la mitad del muslo", 5:"Arr. de tres posiciones", 6:"Arr. de tacos altos",
  7:"Arr. de tacos bajos", 8:"Arr. sin desplazamiento", 9:"Arr. lenta",
  10:"Dos tiempos", 11:"Cargada de dos tiempos", 12:"Cargada col. encima de la rodilla",
  13:"Cargada col. debajo de la rodilla", 14:"Cargada de mitad del muslo",
  15:"Cargada de tres posiciones", 16:"Cargada de tacos altos", 17:"Cargada de tacos bajos",
  18:"Jerk", 19:"Jerk detrás", 20:"Arrancada de fuerza",
  21:"Arr. de fuerza enc. de la rodilla", 22:"Arr. de fuerza deb. de la rodilla",
  23:"Arr. de fuerza de tacos bajos", 24:"Arr. de fuerza de tacos altos",
  25:"Arr. de fuerza sin flexión", 26:"Arr. de fuerza pies juntos",
  27:"Arr. de fuerza sin impulso", 28:"Arr. de fuerza sin desplazamiento",
  29:"Push jerk", 30:"Push jerk detrás", 31:"Push press", 32:"Push press detrás",
  33:"Cargada de fuerza", 34:"Cargada de fza. deb. de la rodilla",
  35:"Cargada de fza. enc. de la rodilla", 36:"Cargada de fza. tacos bajos",
  37:"Cargada fza. tacos altos", 38:"Cargada de fuerza + jerk",
  39:"Cargada de fuerza + push jerk", 40:"Tirón de arrancada técnico",
  41:"Tirón de arrancada colgante", 42:"Tirón de arrancada lento",
  43:"Tirón de arrancada tacos altos", 44:"Tirón de arrancada tacos bajos",
  45:"Tirón de arrancada final", 46:"Tirón de arr. tacos final",
  47:"Tirón de dos tiempos lento", 48:"Tirón de dos tiempos técnico",
  49:"Tirón de dos tiempos colgante", 50:"Sentadilla detrás", 51:"Sentadilla delante",
  52:"Sentadilla delante + jerk", 53:"Sentadilla de arrancada", 54:"Piernas en split delante",
  55:"Piernas en split detrás", 56:"Media sentadilla por detrás", 57:"Media sentadilla por delante"
};

const DAY_NAMES = { L:'Lunes', M:'Martes', X:'Miércoles', J:'Jueves', V:'Viernes', S:'Sábado', D:'Domingo' };
const DAY_ORDER = ['L','M','X','J','V','S','D'];
const REST_WORDS = ['REST','DESCANSO'];

if (window.pdfjsLib){
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.worker.min.js';
}

/* ============== PARSER ============== */
function norm(v){ if (v === null || v === undefined) return ''; return String(v).trim(); }

// Reconoce celdas de código de ejercicio, incluyendo combos con aclaraciones
// de texto libre: "51", "51 con parada +51", "3+21"... Cada trozo separado
// por "+" empieza por un código y puede llevar detrás una aclaración libre
// ("con parada", "lento", etc.). Devuelve un array de partes
// [{code, modifier}] o null si la celda no tiene pinta de código.
function parseCodeCell(codeCell){
  const raw = String(codeCell).trim();
  if (!raw) return null;
  const segments = raw.split('+').map(s=>s.trim()).filter(Boolean);
  if (!segments.length) return null;
  const parts = [];
  for (const seg of segments){
    const m = seg.match(/^(\d+)\s*(.*)$/);
    if (!m) return null; // algún trozo no empieza por un número -> no es un código
    parts.push({ code: parseInt(m[1],10), modifier: m[2].trim() || null });
  }
  return parts;
}

// Construye el nombre visible de un ejercicio (o combo) a partir de sus partes.
function buildComboName(parts){
  return parts.map(p=>{
    const base = DICT[p.code] || ('Código ' + p.code);
    return p.modifier ? (base + ' ' + p.modifier.toUpperCase()) : base;
  }).join(' + ');
}

// Reconoce celdas de repeticiones simples ("5") o repartidas entre las partes
// de un combo ("2+1" = 2 repes de la primera parte, 1 de la segunda).
function parseRepsCell(v){
  if (v === null || v === undefined) return { total:null, parts:null };
  const raw = String(v).trim();
  if (!raw) return { total:null, parts:null };
  if (/^\d+([.,]\d+)?$/.test(raw)){
    return { total: Number(raw.replace(',','.')), parts: null };
  }
  if (raw.includes('+')){
    const bits = raw.split('+').map(s=>s.trim());
    const nums = bits.map(b=> /^\d+([.,]\d+)?$/.test(b) ? Number(b.replace(',','.')) : null);
    if (nums.some(n=>n===null)) return { total:null, parts:null };
    return { total: nums.reduce((a,b)=>a+b,0), parts: nums };
  }
  return { total:null, parts:null };
}

function parseRows(rows){
  let headerRowIdx = -1, codeColIdx = -1;
  for (let r=0; r<rows.length; r++){
    const row = rows[r] || [];
    for (let c=0; c<row.length; c++){
      const val = norm(row[c]).toUpperCase();
      if (val === 'CODIGO' || val === 'CÓDIGO'){ headerRowIdx = r; codeColIdx = c; break; }
    }
    if (headerRowIdx !== -1) break;
  }
  if (headerRowIdx === -1) return { ok:false, error:'no-header', rows };

  const header = rows[headerRowIdx] || [];
  let toColIdx = -1;
  for (let c=codeColIdx+1; c<header.length; c++){
    const up = norm(header[c]).toUpperCase();
    if (up === 'TO' || up.startsWith('TO ') || up.startsWith('TO\t')){ toColIdx = c; break; }
  }
  if (toColIdx === -1) toColIdx = header.length;

  const dayColIdx = 0;
  const refColIdx = codeColIdx + 1;
  const groupStart = refColIdx + 1;
  const numGroups = Math.max(0, Math.floor((toColIdx - groupStart) / 3));

  let athlete = null, week = null, jornada = null;
  const skipWords = ['PLAN','SEMANA','KG','MAXIMOS','MÁXIMOS','OBJETIVOS','COMPETICION','COMPETICIÓN','HISTORICO','HISTÓRICO','MEJORA','CODIGO','CÓDIGO','REF','ENTRENAMIENTO'];
  for (let r=0; r<headerRowIdx; r++){
    const row = rows[r] || [];
    for (let c=0; c<row.length; c++){
      const val = norm(row[c]);
      const up = val.toUpperCase();
      if (up === 'SEMANA'){
        for (let cc=c+1; cc<row.length; cc++){
          if (row[cc] !== null && norm(row[cc]) !== ''){ week = row[cc]; break; }
        }
      }
      if (up.includes('JORNADA') || up.includes('ANDALUZ') || up.includes('LIGA') || up.includes('CAMPEONATO')){
        if (!jornada || val.length > jornada.length) jornada = val;
      }
    }
  }
  for (let r=0; r<headerRowIdx; r++){
    const row = rows[r] || [];
    for (let c=0; c<row.length; c++){
      const val = norm(row[c]);
      if (val && val === val.toUpperCase() && /^[A-ZÁÉÍÓÚÑ]{3,}$/.test(val) && !skipWords.includes(val) && !val.includes('JORNADA') && !val.includes('ANDALUZ')){
        athlete = val; break;
      }
    }
    if (athlete) break;
  }

  const days = {};
  let currentDay = null;

  for (let r=headerRowIdx+1; r<rows.length; r++){
    const row = rows[r] || [];
    const dayCell = norm(row[dayColIdx]).toUpperCase();
    if (dayCell && DAY_ORDER.includes(dayCell)){
      currentDay = dayCell;
      if (!days[currentDay]) days[currentDay] = [];
    }
    if (!currentDay) continue;

    const codeCellRaw = row[codeColIdx];
    const codeCell = norm(codeCellRaw);
    if (!codeCell) continue;

    const parts = parseCodeCell(codeCell);
    const entry = { sets: [] };

    if (parts){
      entry.type = 'exercise';
      entry.code = parts[0].code;
      entry.parts = (parts.length > 1 || parts[0].modifier) ? parts : null;
      entry.name = buildComboName(parts);
    } else {
      entry.type = REST_WORDS.includes(codeCell.toUpperCase()) ? 'rest' : 'note';
      entry.label = codeCell;
    }

    if (entry.type === 'exercise'){
      for (let g=0; g<numGroups; g++){
        const kgIdx = groupStart + g*3;
        const kg = row[kgIdx], s = row[kgIdx+1], rr = row[kgIdx+2];
        if (kg !== null && kg !== undefined && kg !== '' && !isNaN(Number(kg))){
          const repsInfo = parseRepsCell(rr);
          entry.sets.push({
            kg: Number(kg),
            series: (s!==null&&s!==undefined&&s!=='' && !isNaN(Number(s)))? Number(s): null,
            reps: repsInfo.total,
            repsParts: repsInfo.parts
          });
        }
      }
      if (entry.sets.length === 0) continue;
    }

    days[currentDay].push(entry);
  }

  const anyData = Object.keys(days).length > 0;
  if (!anyData) return { ok:false, error:'no-days', rows };

  return { ok:true, meta:{ athlete, week, jornada }, days };
}

function parseWorkbook(workbook){
  const sheetName = workbook.SheetNames[0];
  const sheet = workbook.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(sheet, { header:1, raw:true, defval:null });
  return parseRows(rows);
}

/* ============== PDF PARSER ============== */
/* PDFs have no cells, just positioned text. We rebuild a grid the same shape
   parseRows() expects by anchoring column x-positions from the header row
   ("CODIGO" ... "TO") and bucketing every other text item into the nearest
   column to its left (a "floor" search), which mirrors how a spreadsheet's
   printed/exported PDF actually lays out cell content. */
const PDF_HEADER_WORDS = ['CODIGO','CÓDIGO','REF','KG','S','R','TO','PM','IMR'];

function pdfExpandTokens(item){
  const raw = item.str;
  const str = raw.trim();
  if (!str) return [];
  const words = str.split(/\s+/);
  const isAllNumeric = words.every(w => /^\d+([.,]\d+)?%?$/.test(w));
  const isAllHeaderWords = words.length > 1 && words.every(w => PDF_HEADER_WORDS.includes(w.toUpperCase()));
  if (!(isAllNumeric || isAllHeaderWords) || words.length === 1){
    return [{ str, x: item.x, y: item.y }];
  }
  const out = [];
  const re = /\S+/g;
  let m;
  const len = raw.length || 1;
  while ((m = re.exec(raw)) !== null){
    const estX = item.x + (m.index / len) * item.width;
    out.push({ str: m[0], x: estX, y: item.y });
  }
  return out;
}

function pdfGroupRows(items, yTol){
  const sorted = [...items].sort((a,b)=> b.y - a.y);
  const rows = [];
  sorted.forEach(it=>{
    let row = rows.find(r => Math.abs(r.y - it.y) <= yTol);
    if (!row){ row = { y: it.y, items: [] }; rows.push(row); }
    row.items.push(it);
  });
  rows.forEach(r => r.items.sort((a,b)=> a.x - b.x));
  rows.sort((a,b)=> b.y - a.y);
  return rows;
}

function pdfFindHeaderRow(rows){
  for (const r of rows){
    if (r.items.some(it => norm(it.str).toUpperCase()==='CODIGO' || norm(it.str).toUpperCase()==='CÓDIGO')) return r;
  }
  return null;
}

function pdfBuildBoundaries(headerRow){
  const relevant = headerRow.items.filter(it => PDF_HEADER_WORDS.includes(norm(it.str).toUpperCase()));
  relevant.sort((a,b)=>a.x-b.x);
  const boundaries = [0];
  let seenCodigo = false, seenTo = false;
  for (const it of relevant){
    const up = norm(it.str).toUpperCase();
    if (up === 'CODIGO' || up === 'CÓDIGO'){ boundaries.push(it.x); seenCodigo = true; continue; }
    if (!seenCodigo) continue;
    if (seenTo) break;
    boundaries.push(it.x);
    if (up === 'TO') seenTo = true;
  }
  return boundaries;
}

function pdfAssignRow(row, boundaries, tol){
  const out = new Array(boundaries.length).fill(null);
  row.items.forEach(it=>{
    let idx = 0;
    for (let i=0;i<boundaries.length;i++){ if (boundaries[i] <= it.x + tol) idx = i; else break; }
    if (out[idx] === null) out[idx] = norm(it.str);
    else out[idx] += ' ' + norm(it.str);
  });
  return out;
}

async function extractGridFromPdf(arrayBuffer){
  const data = new Uint8Array(arrayBuffer);
  const doc = await window.pdfjsLib.getDocument({ data }).promise;
  let allRows = [];
  let boundaries = null;

  for (let p=1; p<=doc.numPages; p++){
    const page = await doc.getPage(p);
    const content = await page.getTextContent();
    const items = content.items.map(it => ({ str: it.str, x: it.transform[4], y: it.transform[5], width: it.width }))
                               .filter(it => norm(it.str) !== '');
    const tokens = items.flatMap(pdfExpandTokens);
    const rows = pdfGroupRows(tokens, 3);

    if (!boundaries){
      const headerRow = pdfFindHeaderRow(rows);
      if (headerRow) boundaries = pdfBuildBoundaries(headerRow);
    }
    if (!boundaries) continue;

    rows.forEach(r => allRows.push(pdfAssignRow(r, boundaries, 4)));
  }
  return allRows;
}

async function parsePdf(arrayBuffer){
  const rows = await extractGridFromPdf(arrayBuffer);
  return parseRows(rows);
}

/* ============== IMAGE / SCANNED-PDF OCR PARSER ==============
   For PDFs that are actually a flattened photo/screenshot (no text layer)
   and for direct photo uploads. Detects the printed table's grid LINES
   (not text) from pixel data, OCRs each cell individually, and assigns
   day letters by position (L,M,X,J,V,S always appear in that fixed order
   in this coach's template) rather than trying to OCR the stylised
   rotated letters, which is unreliable. Because OCR can misread a digit,
   the result always goes through a review screen before being saved. */

const OCR_DAY_ORDER = ['L','M','X','J','V','S','D'];

function ocrClusterPositions(sortedIndices, gap){
  if (!sortedIndices.length) return [];
  const groups = [[sortedIndices[0]]];
  for (let i=1;i<sortedIndices.length;i++){
    if (sortedIndices[i]-groups[groups.length-1][groups[groups.length-1].length-1] <= gap){
      groups[groups.length-1].push(sortedIndices[i]);
    } else groups.push([sortedIndices[i]]);
  }
  return groups.map(g => Math.round(g.reduce((a,b)=>a+b,0)/g.length));
}

function ocrClusterGroups(sortedIndices, gap){
  if (!sortedIndices.length) return [];
  const groups = [[sortedIndices[0]]];
  for (let i=1;i<sortedIndices.length;i++){
    if (sortedIndices[i]-groups[groups.length-1][groups[groups.length-1].length-1] <= gap){
      groups[groups.length-1].push(sortedIndices[i]);
    } else groups.push([sortedIndices[i]]);
  }
  return groups;
}

// Build a grayscale "darkness" lookup from canvas pixel data (1 = dark/ink, 0 = light)
function ocrBuildDarkMask(imageData){
  const { data, width, height } = imageData;
  const mask = new Uint8Array(width*height);
  for (let i=0, p=0; i<data.length; i+=4, p++){
    const lum = 0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2];
    mask[p] = lum < 180 ? 1 : 0;
  }
  return { mask, width, height };
}

function ocrRowDarkFrac(mask, width, height, x0=0, x1=width){
  const out = new Float32Array(height);
  const span = x1 - x0;
  for (let y=0;y<height;y++){
    let c = 0;
    const base = y*width;
    for (let x=x0;x<x1;x++) c += mask[base+x];
    out[y] = c/span;
  }
  return out;
}

function ocrColDarkFrac(mask, width, height, y0=0, y1=height){
  const out = new Float32Array(width);
  for (let x=0;x<width;x++){
    let c = 0;
    for (let y=y0;y<y1;y++) c += mask[y*width+x];
    out[x] = c/(y1-y0);
  }
  return out;
}

// Find the tight bounding box of non-white content, to trim margins.
function ocrContentBBox(mask, width, height){
  let top=null, bottom=null, left=null, right=null;
  const rowFrac = ocrRowDarkFrac(mask, width, height);
  for (let y=0;y<height;y++){ if (rowFrac[y] > 0.002){ if (top===null) top=y; bottom=y; } }
  if (top===null) return null;
  const colFrac = ocrColDarkFrac(mask, width, height, top, bottom+1);
  for (let x=0;x<width;x++){ if (colFrac[x] > 0.002){ if (left===null) left=x; right=x; } }
  return { top, bottom, left, right };
}

async function ocrCropCanvas(srcCanvas, x0,y0,x1,y1){
  const w = Math.max(1, x1-x0), h = Math.max(1, y1-y0);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.drawImage(srcCanvas, x0, y0, w, h, 0, 0, w, h);
  return c;
}

function ocrNorm(v){ return v===null||v===undefined ? '' : String(v).trim(); }
function ocrFuzzyEq(a, b){
  a = ocrNorm(a).toUpperCase(); b = b.toUpperCase();
  if (!a) return false;
  if (a === b) return true;
  if (a.length >= 2 && (a.includes(b) || b.includes(a))) return true;
  return false;
}

async function extractGridFromImageCanvas(sourceCanvas, onProgress){
  // 1. Work at a consistent resolution for reliable thresholds
  const targetW = 3000;
  const scale = Math.min(2.5, targetW / sourceCanvas.width);
  let work = sourceCanvas;
  if (Math.abs(scale-1) > 0.05){
    const c = document.createElement('canvas');
    c.width = Math.round(sourceCanvas.width*scale);
    c.height = Math.round(sourceCanvas.height*scale);
    c.getContext('2d').drawImage(sourceCanvas, 0,0,c.width,c.height);
    work = c;
  }
  const ctx = work.getContext('2d');
  let imageData = ctx.getImageData(0,0,work.width,work.height);
  let { mask, width, height } = ocrBuildDarkMask(imageData);

  // 2. trim to content bbox
  const bbox = ocrContentBBox(mask, width, height);
  if (!bbox) return { ok:false, error:'blank-image' };
  const cropped = await ocrCropCanvas(work, bbox.left, bbox.top, bbox.right+1, bbox.bottom+1);
  imageData = cropped.getContext('2d').getImageData(0,0,cropped.width,cropped.height);
  ({ mask, width, height } = ocrBuildDarkMask(imageData));

  // 3. fine grid lines (this may include a few extra rows/cols from a title
  //    block or logo above the real table -- harmless, we locate the real
  //    header row explicitly in step 4 rather than assuming row 0 is it)
  const rowFrac = ocrRowDarkFrac(mask, width, height);
  const colFrac = ocrColDarkFrac(mask, width, height);
  const rowLineIdx = []; for (let y=0;y<height;y++) if (rowFrac[y] > 0.5) rowLineIdx.push(y);
  const colLineIdx = []; for (let x=0;x<width;x++) if (colFrac[x] > 0.5) colLineIdx.push(x);
  let rowB = ocrClusterPositions(rowLineIdx, 15);
  let colB = ocrClusterPositions(colLineIdx, 15);
  if (!rowB.length || !colB.length) return { ok:false, error:'no-grid' };
  if (colB[0] > 5) colB = [0, ...colB];
  if (rowB.length < 2 || colB.length < 2) return { ok:false, error:'no-grid' };

  const worker = await Tesseract.createWorker('spa');
  await worker.setParameters({ tessedit_pageseg_mode: '7' });

  async function ocrCell(x0,y0,x1,y1,inset){
    const ix0=x0+inset, iy0=y0+inset, ix1=x1-inset, iy1=y1-inset;
    if (ix1<=ix0 || iy1<=iy0) return '';
    let dcount=0, total=0;
    for (let y=iy0;y<iy1;y++) for (let x=ix0;x<ix1;x++){ total++; if (mask[y*width+x]) dcount++; }
    if (total===0 || dcount/total < 0.0015) return '';
    let crop = await ocrCropCanvas(cropped, ix0, iy0, ix1, iy1);
    if (crop.width < 120){
      const factor = Math.max(1, Math.round(150/Math.max(crop.width,1)));
      const c2 = document.createElement('canvas');
      c2.width = crop.width*factor; c2.height = crop.height*factor;
      c2.getContext('2d').drawImage(crop, 0,0,c2.width,c2.height);
      crop = c2;
    }
    const { data: { text } } = await worker.recognize(crop);
    return text.trim();
  }

  // 4. locate the real header row (scan from the top until a cell reads
  //    "CODIGO") -- this skips past any title/logo/summary block above the
  //    actual table, so day-block detection below never gets confused by it.
  let headerRowIdx = -1, codeColIdx = -1;
  const headerScanLimit = Math.min(rowB.length-1, 10);
  for (let ri=0; ri<headerScanLimit && headerRowIdx===-1; ri++){
    const y0=rowB[ri], y1=rowB[ri+1];
    for (let ci=0; ci<colB.length-1; ci++){
      const x0=colB[ci], x1=colB[ci+1];
      const txt = await ocrCell(x0,y0,x1,y1,6);
      if (ocrFuzzyEq(txt,'CODIGO') || ocrFuzzyEq(txt,'CÓDIGO')){
        headerRowIdx = ri; codeColIdx = ci; break;
      }
    }
  }
  if (headerRowIdx === -1){ await worker.terminate(); return { ok:false, error:'no-header-visual' }; }

  // 5. day-letter blocks via ink density in the sidebar, restricted to rows
  //    at/after the header (so a logo or title block above can't shift them)
  const dayX1 = colB[1];
  const dayScanY0 = rowB[headerRowIdx];
  const dayRowFrac = ocrRowDarkFrac(mask, width, height, 0, dayX1);
  const inkyIdx = []; for (let y=dayScanY0;y<height;y++) if (dayRowFrac[y] > 0.03) inkyIdx.push(y);
  const inkyGroups = ocrClusterGroups(inkyIdx, 20).filter(g => (g[g.length-1]-g[0]) > 40).slice(0,7);
  let dayBlocks = [];
  if (inkyGroups.length){
    const centers = inkyGroups.map(g => (g[0]+g[g.length-1])/2);
    const partition = [dayScanY0];
    for (let i=0;i<centers.length-1;i++) partition.push((centers[i]+centers[i+1])/2);
    partition.push(height);
    dayBlocks = centers.map((_,i)=>({ day: OCR_DAY_ORDER[i], y0: partition[i], y1: partition[i+1] }));
  }
  function yToDay(y){
    for (const b of dayBlocks) if (y >= b.y0 && y < b.y1) return b.day;
    return null;
  }

  // 6. OCR the header row + all data rows below it
  const rowsToRead = rowB.length-1-headerRowIdx;
  const totalCells = rowsToRead * (colB.length-1);
  let done = 0;
  function tick(){ done++; if (onProgress) onProgress(Math.min(0.97, done/Math.max(totalCells,1))); }

  const grid = [];
  for (let ri=headerRowIdx; ri<rowB.length-1; ri++){
    const y0=rowB[ri], y1=rowB[ri+1];
    const rowOut = [ ri===headerRowIdx ? null : yToDay((y0+y1)/2) ];
    for (let ci=1; ci<colB.length-1; ci++){
      const x0=colB[ci], x1=colB[ci+1];
      const txt = await ocrCell(x0,y0,x1,y1,6);
      rowOut.push(txt);
      tick();
    }
    grid.push(rowOut);
  }
  await worker.terminate();
  if (onProgress) onProgress(1);

  return { ok:true, rows: grid };
}

function parseOcrGrid(rows){
  let headerRowIdx=-1, codeColIdx=-1;
  for (let r=0;r<rows.length;r++){
    const row = rows[r]||[];
    for (let c=1;c<row.length;c++){
      if (ocrFuzzyEq(row[c],'CODIGO') || ocrFuzzyEq(row[c],'CÓDIGO')){ headerRowIdx=r; codeColIdx=c; break; }
    }
    if (headerRowIdx!==-1) break;
  }
  if (headerRowIdx===-1) return { ok:false, error:'no-header', rows };

  const header = rows[headerRowIdx];
  const groupStart = codeColIdx + 2;
  const kgIdxs = [];
  for (let i=groupStart;i<header.length;i++) if (ocrFuzzyEq(header[i],'KG')) kgIdxs.push(i);
  const numGroups = kgIdxs.length ? Math.floor((Math.max(...kgIdxs)-groupStart)/3)+1 : 0;

  const days = {};
  let currentDay = null;
  for (let r=headerRowIdx+1; r<rows.length; r++){
    const row = rows[r]||[];
    const dayCell = row[0];
    if (dayCell && OCR_DAY_ORDER.includes(dayCell)){
      currentDay = dayCell;
      if (!days[currentDay]) days[currentDay] = [];
    }
    if (!currentDay) continue;
    const codeCell = ocrNorm(row[codeColIdx]);
    if (!codeCell) continue;
    if (codeCell.toUpperCase()==='NOTAS') break; // footer reached, stop
    const parts = parseCodeCell(codeCell);
    const entry = { sets: [] };
    if (parts){
      entry.type = 'exercise';
      entry.code = parts[0].code;
      entry.parts = (parts.length > 1 || parts[0].modifier) ? parts : null;
      entry.name = buildComboName(parts);
      for (let g=0; g<numGroups; g++){
        const kgIdx = groupStart+g*3;
        if (kgIdx+2 >= row.length) break;
        const kg = ocrNorm(row[kgIdx]), s = ocrNorm(row[kgIdx+1]), rr = ocrNorm(row[kgIdx+2]);
        if (/^\d+([.,]\d+)?$/.test(kg)){
          const repsInfo = parseRepsCell(rr);
          entry.sets.push({
            kg: Number(kg.replace(',','.')),
            series: /^\d+$/.test(s) ? Number(s) : null,
            reps: repsInfo.total,
            repsParts: repsInfo.parts
          });
        }
      }
      if (entry.sets.length===0) continue;
    } else {
      entry.type = REST_WORDS.includes(codeCell.toUpperCase()) ? 'rest' : 'note';
      entry.label = codeCell;
    }
    days[currentDay].push(entry);
  }
  if (Object.keys(days).length===0) return { ok:false, error:'no-days', rows };
  return { ok:true, meta:{ athlete:null, week:null, jornada:null }, days, needsReview:true };
}

async function parseImageOrScannedPdf(sourceCanvas, onProgress){
  const grid = await extractGridFromImageCanvas(sourceCanvas, onProgress);
  if (!grid.ok) return grid;
  return parseOcrGrid(grid.rows);
}

async function loadImageFileToCanvas(file){
  const dataUrl = await new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
  const img = await new Promise((res,rej)=>{
    const im = new Image();
    im.onload = ()=>res(im);
    im.onerror = rej;
    im.src = dataUrl;
  });
  const c = document.createElement('canvas');
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  c.getContext('2d').drawImage(img,0,0);
  return c;
}

async function renderPdfPageToCanvas(arrayBuffer, pageNum, scale){
  const doc = await window.pdfjsLib.getDocument({ data: new Uint8Array(arrayBuffer) }).promise;
  const page = await doc.getPage(pageNum);
  const viewport = page.getViewport({ scale });
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width; canvas.height = viewport.height;
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  return canvas;
}



/* ============== ALMACENAMIENTO PERSISTENTE ==============
   Usa window.storage (el almacén propio de los artefactos de Claude, que
   persiste de verdad entre sesiones) en vez de localStorage, que en el
   sandbox donde corre este artefacto no sobrevive fiablemente a cerrar la
   app. Si por algún motivo window.storage no estuviera disponible, cae de
   vuelta a localStorage como último recurso (mejor que nada, aunque no
   persista igual de bien). */
function hasArtifactStorage(){
  return typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';
}
async function storageGet(key){
  if (hasArtifactStorage()){
    try{ const r = await window.storage.get(key, false); return r ? r.value : null; }catch(e){ return null; }
  }
  try{ return localStorage.getItem('wl_'+key); }catch(e){ return null; }
}
async function storageSet(key, value){
  if (hasArtifactStorage()){
    try{ await window.storage.set(key, value, false); return; }catch(e){}
  }
  try{ localStorage.setItem('wl_'+key, value); }catch(e){}
}
async function storageDelete(key){
  if (hasArtifactStorage()){

  inp.placeholder = '1-10';

// Las notas del día ahora pueden llevar, además del texto libre, un par de
// datos rápidos útiles para quien revise el entreno a distancia (RPE y
// sensación general). Se guardan como objeto; se admite el formato antiguo
// (solo texto) por compatibilidad con notas ya guardadas.
function normalizeNote(raw){
  if (!raw) return { text:'', rpe:null, feeling:null };
  if (typeof raw === 'string') return { text: raw, rpe:null, feeling:null };
  return { text: raw.text||'', rpe: (raw.rpe===undefined?null:raw.rpe), feeling: (raw.feeling===undefined?null:raw.feeling) };
}

// Escala de valoración de cada peso/serie: 5 niveles con icono, sin texto.
// Se guarda como número 1-5. Se admiten los valores antiguos 'ok'/'bad'
// (del sistema binario previo) por compatibilidad con marcas ya guardadas.
const SET_RATING_LEVELS = [
  { value:1, icon:'😫', color:'#c14a3a' }, // muy mal
  { value:2, icon:'😞', color:'#d9793f' }, // mal
  { value:3, icon:'😐', color:'#c99a2e' }, // regular
  { value:4, icon:'🙂', color:'#5a8fb0' }, // bien
  { value:5, icon:'💪', color:'#2f7dc4' }  // muy bien
];
function normalizeCheck(raw){
  if (raw === 'ok') return 4;
  if (raw === 'bad') return 2;
  const n = Number(raw);
  return (n>=1 && n<=5) ? n : null;
}
function ratingInfo(value){ return SET_RATING_LEVELS.find(l=>l.value===value) || null; }

let userDataCache = {}; // { userId: {plans,checks,notes} } — caché en memoria para no repetir lecturas

async function loadUserDataAsync(userId){
  try{
    const raw = await storageGet(userDataKey(userId));
    const data = raw ? (function(){ const p = JSON.parse(raw); return { plans:p.plans||[], checks:p.checks||{}, notes:p.notes||{} }; })() : { plans:[], checks:{}, notes:{} };
    userDataCache[userId] = data;
    return data;
  }catch(e){
    const empty = { plans:[], checks:{}, notes:{} };
    userDataCache[userId] = empty;
    return empty;
  }
}
function saveUserDataAsync(userId, data){
  userDataCache[userId] = data;
  scheduleUserPush(userId);
  return storageSet(userDataKey(userId), JSON.stringify(data));
}
function deleteUserDataAsync(userId){
  delete userDataCache[userId];
  if (!applyingRemoteSync && syncCode && syncStatus==='on'){
    try{ userDocRef(userId).delete(); }catch(e){}
  }
  return storageDelete(userDataKey(userId));
}
function persistUserData(){
  saveUserDataAsync(activeUserId, { plans: state.plans, checks: state.checks, notes: state.notes });
}
function prefetchAllUserData(){
  users.forEach(u=>{
    if (!userDataCache[u.id]){
      loadUserDataAsync(u.id).then(()=>{ if (state.showUsers) render(); });
    }
  });
}

// Migración desde la versión antigua del almacenamiento (localStorage),
// para no perder datos que ya existieran de sesiones previas en este navegador.
async function migrateLegacyLocalStorage(){
  let legacyUsers = [];
  try{ legacyUsers = JSON.parse(localStorage.getItem('wl_users_v1')) || []; }catch(e){}
  if (!legacyUsers.length) return null;
  for (const u of legacyUsers){
    let plans = [], checks = {}, notes = {};
    try{ plans = JSON.parse(localStorage.getItem('wl_plans_v1__'+u.id)) || []; }catch(e){}
    try{ checks = JSON.parse(localStorage.getItem('wl_checks_v1__'+u.id)) || {}; }catch(e){}
    try{ notes = JSON.parse(localStorage.getItem('wl_notes_v1__'+u.id)) || {}; }catch(e){}
    await saveUserDataAsync(u.id, { plans, checks, notes });
  }
  await saveUsersAsync(legacyUsers);
  let legacyActive = null;
  try{ legacyActive = localStorage.getItem('wl_active_user_v1'); }catch(e){}
  const activeId = (legacyActive && legacyUsers.find(u=>u.id===legacyActive)) ? legacyActive : legacyUsers[0].id;
  await saveActiveUserIdAsync(activeId);
  return { users: legacyUsers, activeUserId: activeId };
}

/* ============== SINCRONIZACIÓN ENTRE DISPOSITIVOS (Firebase) ==============
   Opcional: si el usuario activa un "código de sincronización", los datos
   se guardan también en Firestore, y cualquier otro dispositivo con el
   mismo código lee y escribe los mismos datos, casi en tiempo real. Sin
   código, la app funciona exactamente igual que antes (solo local).

   IMPORTANTE (diseño): cada deportista tiene su PROPIO documento en la
   nube (sync_codes/{code}/users/{userId}), separado de la lista de
   deportistas (sync_codes/{code}, campo "users"). Un cambio en un
   dispositivo solo sube el documento del deportista que realmente cambió
   — nunca "todo junto" — para que dos dispositivos activos a la vez no
   puedan pisarse el trabajo el uno al otro. */

  authDomain: "mi-plan-halterofilia.firebaseapp.com",

const SYNC_CODE_KEY = 'sync_code_v1';
let fbDb = null;
let syncCode = null;
let syncStatus = 'off'; // 'off' | 'connecting' | 'on' | 'error'
let rosterUnsub = null;
let usersColUnsub = null;
let rosterPushTimer = null;
let userPushTimers = {}; // { userId: timeoutId }
let applyingRemoteSync = false;

function ensureFirebase(){
  if (fbDb) return fbDb;
  try{
    firebase.initializeApp(firebaseConfig);
    fbDb = firebase.firestore();
    return fbDb;
  }catch(e){ return null; }
}
function rosterDocRef(){ return ensureFirebase().collection('sync_codes').doc(syncCode); }
function userDocRef(userId){ return rosterDocRef().collection('users').doc(userId); }

function scheduleRosterPush(){
  if (applyingRemoteSync) return;
  if (!syncCode || syncStatus!=='on') return;
  clearTimeout(rosterPushTimer);
  rosterPushTimer = setTimeout(pushRosterNow, 1000);
}
function scheduleUserPush(userId){
  if (applyingRemoteSync) return;
  if (!syncCode || syncStatus!=='on') return;
  clearTimeout(userPushTimers[userId]);
  userPushTimers[userId] = setTimeout(()=>pushUserNow(userId), 1000);
}
async function pushRosterNow(){
  if (!syncCode) return;
  const database = ensureFirebase();
  if (!database) return;
  try{ await rosterDocRef().set({ users, updatedAt: Date.now() }); }catch(e){}
}
async function pushUserNow(userId){
  if (!syncCode) return;
  const database = ensureFirebase();
  if (!database) return;
  const data = userDataCache[userId] || await loadUserDataAsync(userId);
  try{ await userDocRef(userId).set(Object.assign({}, data, { updatedAt: Date.now() })); }catch(e){}
}

function applyRemoteUserDoc(uid, data){
  applyingRemoteSync = true;
  const d = { plans: (data&&data.plans)||[], checks: (data&&data.checks)||{}, notes: (data&&data.notes)||{} };
  userDataCache[uid] = d;
  saveUserDataAsync(uid, d);
  if (uid === activeUserId){
    state.plans = d.plans; state.checks = d.checks; state.notes = d.notes;
    const sorted = [...state.plans].sort((a,b)=>a.uploadedAt-b.uploadedAt);
    state.activePlanId = sorted.length ? sorted[sorted.length-1].id : null;
    state.reviewDismissed = sorted.length ? !sorted[sorted.length-1].needsReview : false;
  }
  applyingRemoteSync = false;
}

async function startSync(code){
  syncCode = code.trim();
  if (!syncCode) return;
  syncStatus = 'connecting';
  render();
  const database = ensureFirebase();
  if (!database){ syncStatus='error'; render(); return; }
  try{
    const rosterSnap = await rosterDocRef().get();
    if (rosterSnap.exists){
      const rdata = rosterSnap.data();
      applyingRemoteSync = true;
      users = rdata.users || [];
      saveUsersAsync(users);
      applyingRemoteSync = false;
      if (!activeUserId || !users.find(u=>u.id===activeUserId)){
        activeUserId = users[0] ? users[0].id : activeUserId;
      }
      // migración: si el documento antiguo (versión previa) traía los
      // datos embebidos en "data", los usamos como base la primera vez.
      const legacyData = rdata.data || {};
      for (const u of users){
        const uSnap = await userDocRef(u.id).get();
        if (uSnap.exists){
          applyRemoteUserDoc(u.id, uSnap.data());
        } else if (legacyData[u.id]){
          applyRemoteUserDoc(u.id, legacyData[u.id]);
          await pushUserNow(u.id); // lo subimos ya a su documento propio
        } else {
          applyRemoteUserDoc(u.id, { plans:[], checks:{}, notes:{} });
        }
      }
    } else {
      // primera vez con este código: subimos lo que ya tenemos localmente
      await pushRosterNow();
      for (const u of users){ await pushUserNow(u.id); }
    }

    if (rosterUnsub) rosterUnsub();
    rosterUnsub = rosterDocRef().onSnapshot(snap=>{
      if (!snap.exists || snap.metadata.hasPendingWrites) return;
      const rdata = snap.data();
      applyingRemoteSync = true;
      users = rdata.users || users;
      saveUsersAsync(users);
      applyingRemoteSync = false;
      render();
    });

    if (usersColUnsub) usersColUnsub();
    usersColUnsub = rosterDocRef().collection('users').onSnapshot(snap=>{
      snap.docChanges().forEach(change=>{
        if (change.doc.metadata.hasPendingWrites) return;
        const uid = change.doc.id;
        if (change.type === 'removed'){
          delete userDataCache[uid];
          storageDelete(userDataKey(uid));
        } else {
          applyRemoteUserDoc(uid, change.doc.data());
        }
      });
      render();
    });

    await storageSet(SYNC_CODE_KEY, syncCode);
    syncStatus = 'on';
  }catch(e){
    syncStatus = 'error';
  }
  render();
}

function stopSync(){
  if (rosterUnsub){ rosterUnsub(); rosterUnsub=null; }
  if (usersColUnsub){ usersColUnsub(); usersColUnsub=null; }
  syncCode = null;
  syncStatus = 'off';
  storageDelete(SYNC_CODE_KEY);
  render();
}

let storageBackendUsed = 'unknown'; // 'claude' | 'local' | 'none' — diagnóstico visible del almacén real

async function detectStorageBackend(){
  if (!hasArtifactStorage()){ storageBackendUsed = 'local'; return; }
  try{
    const testKey = '__wl_storage_probe__';
    const stamp = String(Date.now());
    await window.storage.set(testKey, stamp, false);
    const r = await window.storage.get(testKey, false);
    storageBackendUsed = (r && r.value === stamp) ? 'claude' : 'local';
  }catch(e){
    storageBackendUsed = 'local';
  }
}

      }
    }
  }
  if (!activeUserId || !users.find(u=>u.id===activeUserId)){
    activeUserId = users[0].id;
    await saveActiveUserIdAsync(activeUserId);
  }

  const data = await loadUserDataAsync(activeUserId);
  state.plans = data.plans;
  state.checks = data.checks;
  state.notes = data.notes;
  const sorted = [...state.plans].sort((a,b)=>a.uploadedAt-b.uploadedAt);
  state.activePlanId = sorted.length ? sorted[sorted.length-1].id : null;

  try{ const raw = await storageGet(LAST_BACKUP_KEY); lastBackupTs = raw ? Number(raw) : null; }catch(e){ lastBackupTs = null; }

  }catch(e){}

function planId(meta){
  return 'w' + (meta.week ?? 'x') + '_' + (meta.jornada ? meta.jornada.replace(/\s+/g,'').slice(0,20) : 'plan');
}

function tonnage(dayEntries){
  let t = 0;
  (dayEntries||[]).forEach(e=>{
    if (e.type === 'exercise'){
      e.sets.forEach(s=>{ t += (s.kg||0) * (s.series||1) * (s.reps||1); });
    }
  });
  return t;
}

function checkKey(plan, day, exIdx, setIdx){
  return plan.id + '|' + day + '|' + exIdx + '|' + setIdx;
}

// Borra un ejercicio del día y reindexa las marcas (bien/mal) del resto de
// ejercicios de ese día, para que no se desincronicen con su nueva posición.
function deleteExerciseEntry(plan, day, idx){
  plan.days[day].splice(idx, 1);
  const prefix = plan.id + '|' + day + '|';
  const newChecks = {};
  Object.keys(state.checks).forEach(k=>{
    if (k.startsWith(prefix)){
      const rest = k.slice(prefix.length);
      const sep = rest.indexOf('|');
      const exIdx = parseInt(rest.slice(0,sep),10);
      const setPart = rest.slice(sep+1);
      if (exIdx === idx) return; // se descartan las marcas del ejercicio borrado
      const newExIdx = exIdx > idx ? exIdx-1 : exIdx;
      newChecks[plan.id+'|'+day+'|'+newExIdx+'|'+setPart] = state.checks[k];
    } else {
      newChecks[k] = state.checks[k];
    }
  });
  state.checks = newChecks;
  persistUserData();
}

function dayStats(plan, day){
  const entries = plan.days[day] || [];
  let totalSets = 0, checkedSets = 0;
  entries.forEach((e,exIdx)=>{
    if (e.type !== 'exercise') return;
    e.sets.forEach((s,setIdx)=>{
      totalSets++;
      if (state.checks[checkKey(plan,day,exIdx,setIdx)]) checkedSets++;
    });
  });
  return { totalSets, checkedSets };
}

    state.activePlanId = null;
    state.reviewDraft = null; state.reviewDraftFor = null;
    render();
  };

function reviewMiniInput(value, placeholder, width, onCommit){
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.inputMode = 'numeric';
  inp.value = value===null||value===undefined ? '' : value;
  inp.placeholder = placeholder || '';
  inp.style.cssText = 'width:'+width+'px;background:var(--surface-2);border:1px solid var(--surface-3);border-radius:7px;color:var(--chalk);font-family:IBM Plex Mono,monospace;font-size:13px;padding:7px 6px;text-align:center;';
  inp.addEventListener('change', ()=> onCommit(inp.value.trim()));
  return inp;
}

function render(){
  root.innerHTML = '';
  if (state.ocrBusy){
    root.appendChild(renderOcrProgress());
    return;
  }
  if (state.showProfile){
    root.appendChild(renderProfileScreen());
    if (state.showUsers) root.appendChild(renderUsersSheet());
    if (state.showBackupText) root.appendChild(renderBackupTextOverlay());
    if (state.showSync) root.appendChild(renderSyncOverlay());
    return;
  }
  const activePlan = state.plans.find(p=>p.id===state.activePlanId);
  if (!activePlan){
    root.appendChild(renderUpload());
    if (state.showUsers) root.appendChild(renderUsersSheet());
    if (state.showBackupText) root.appendChild(renderBackupTextOverlay());
    if (state.showSync) root.appendChild(renderSyncOverlay());
    return;
  }
  if (activePlan.needsReview && !state.reviewDismissed){
    root.appendChild(renderReviewScreen(activePlan));
    return;
  }
  if (state.showAnalytics){
    root.appendChild(renderAnalyticsScreen());
    return;
  }
  if (!state.activeDay || !activePlan.days[state.activeDay]){
    const firstDay = DAY_ORDER.find(d=>activePlan.days[d]);
    state.activeDay = firstDay || 'L';
  }
  root.appendChild(renderApp(activePlan));
  if (state.flashcard) root.appendChild(renderFlashcardOverlay(activePlan));
  if (state.showHistory) root.appendChild(renderHistorySheet());
  if (state.showUsers) root.appendChild(renderUsersSheet());
  if (state.showDayNote) root.appendChild(renderDayNoteOverlay(activePlan));
  if (state.dayReport) root.appendChild(renderDayReportOverlay());
  if (state.weekReport) root.appendChild(renderWeekReportOverlay(activePlan));
  if (state.showMenu) root.appendChild(renderMenuSheet(activePlan));
  if (state.showSync) root.appendChild(renderSyncOverlay());
  if (state.showBackupText) root.appendChild(renderBackupTextOverlay());
}

function el(tag, cls, html){
  const e = document.createElement(tag);

  if (html !== undefined) e.innerHTML = html;
  return e;
}
