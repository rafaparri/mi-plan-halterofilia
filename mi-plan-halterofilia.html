function handleFile(file){
  const name = (file.name || '').toLowerCase();
  const isPdf = name.endsWith('.pdf');
  const isImage = /\.(jpe?g|png|webp|heic)$/i.test(name) || (file.type && file.type.startsWith('image/'));

  async function run(buf){
    try{
      let result;

      if (isImage){
        state.ocrBusy = true; state.ocrProgress = 0; render();
        const canvas = await loadImageFileToCanvas(file);
        result = await parseImageOrScannedPdf(canvas, (p)=>{ state.ocrProgress = p; render(); });
        state.ocrBusy = false;
      } else if (isPdf){
        result = await parsePdf(buf);
        if (!result.ok){
          // no text layer found -- fall back to OCR by rendering the page(s) as images
          state.ocrBusy = true; state.ocrProgress = 0; render();
          try{
            const canvas = await renderPdfPageToCanvas(buf, 1, 3);
            result = await parseImageOrScannedPdf(canvas, (p)=>{ state.ocrProgress = p; render(); });
          } finally {
            state.ocrBusy = false;
          }
        }
      } else {
        const data = new Uint8Array(buf);
        const wb = XLSX.read(data, { type:'array' });
        result = parseWorkbook(wb);
      }

      if (!result.ok){
        state.error = 'No he podido leer ese archivo. Si es una foto o un PDF escaneado, asegúrate de que la tabla se vea entera, recta y con buena luz. Si puedes, pide el Excel original y lo intentamos con ese.';
        state.rawPreview = result.rows ? result.rows.slice(0,20) : null;
        render();
        return;
      }
      const meta = result.meta || {};
      const id = planId(meta);
      const plan = { id, meta, days: result.days, uploadedAt: Date.now(), needsReview: !!result.needsReview };
      const existingIdx = state.plans.findIndex(p=>p.id===id);
      if (existingIdx >= 0) state.plans[existingIdx] = plan;
      else state.plans.push(plan);
      persistUserData();
      state.activePlanId = id;
      state.activeDay = null;
      state.error = null;
      state.reviewDismissed = false;
      render();
    }catch(err){
      state.ocrBusy = false;
      state.error = 'Ha ocurrido un error leyendo el archivo (' + (err && err.message ? err.message : 'error desconocido') + '). Prueba de nuevo o con otro archivo.';
      render();
    }
  }

  if (isImage){
    run(null);
  } else {
    const reader = new FileReader();
    reader.onload = (e)=> run(e.target.result);
    reader.readAsArrayBuffer(file);
  }
}

/* ---- Main app ---- */
function renderApp(plan){
  const wrap = el('div','app');

  // topbar
  const top = el('div','topbar');
  const row = el('div','topbar-row');
  const left = el('div');
  left.appendChild(el('div','athlete-name', plan.customName || plan.meta.athlete || 'Mi plan'));
  const metaBits = [];
  if (plan.meta.jornada) metaBits.push(plan.meta.jornada);
  left.appendChild(el('div','meta-line', metaBits.join(' · ') || 'Plan de entrenamiento'));
  row.appendChild(left);
  if (plan.meta.week !== null && plan.meta.week !== undefined){
    row.appendChild(el('div','week-chip','Semana ' + plan.meta.week));
  }
  top.appendChild(row);

  const actions = el('div','topbar-actions');
  const histBtn = el('button','tb-btn','Semanas (' + state.plans.length + ')');
  histBtn.onclick = ()=>{ state.showHistory = true; render(); };
  actions.appendChild(histBtn);
  const menuBtn = el('button','tb-btn tb-btn-menu','☰ Menú');
  menuBtn.onclick = ()=>{ state.showMenu = true; render(); };
  actions.appendChild(menuBtn);
  top.appendChild(actions);
  wrap.appendChild(top);

  // plate row
  const plateRow = el('div','plate-row');
  const tonnages = DAY_ORDER.filter(d=>plan.days[d]).map(d=>tonnage(plan.days[d]));
  const maxT = Math.max(1, ...tonnages);
  const minSize = 44, maxSize = 74;

  DAY_ORDER.forEach(d=>{
    if (!plan.days[d]) return;
    const entries = plan.days[d];
    const isRestOnly = entries.length && entries.every(e=>e.type==='rest');
    const t = tonnage(entries);
    const size = isRestOnly ? 44 : Math.round(minSize + (maxSize-minSize) * (t/maxT));

    const btn = el('button','plate-wrap' + (state.activeDay===d ? ' active':''));
    const plate = el('div','plate');
    plate.style.width = size+'px';
    plate.style.height = size+'px';
    plate.style.fontSize = (size>60? 17:14)+'px';

    let color = '#3a3c46';
    if (isRestOnly) color = 'var(--rest)';
    else if (entries.some(e=>e.type==='note')) color = 'var(--red)';
    else color = ['var(--blue)','var(--yellow)','var(--purple)','var(--red)'][d.length % 4] ;
    // stable color by day letter for consistency
    const palette = { L:'var(--red)', M:'var(--rest)', X:'var(--blue)', J:'var(--yellow)', V:'var(--rest)', S:'var(--purple)' };
    plate.style.background = isRestOnly ? 'var(--rest)' : (palette[d] || 'var(--blue)');
    plate.style.color = (d==='J') ? '#26210a' : '#f4f1ea';
    plate.textContent = d;

    // progress ring based on checked SETS (not just exercises)
    const { totalSets, checkedSets } = dayStats(plan, d);
    if (totalSets>0 && checkedSets>0){
      plate.style.boxShadow = `inset 0 0 0 3px rgba(244,241,234,${0.15+0.55*(checkedSets/totalSets)})`;
    }

    btn.appendChild(plate);
    btn.appendChild(el('div','plate-label', DAY_NAMES[d].slice(0,3)));
    btn.onclick = ()=>{ state.activeDay = d; render(); };
    plateRow.appendChild(btn);
  });
  wrap.appendChild(plateRow);

  // day section
  const section = el('div','day-section');
  const entries = plan.days[state.activeDay] || [];
  const heading = el('div','day-heading');
  heading.style.alignItems = 'center';
  const headLeft = el('div');
  headLeft.appendChild(el('h2', null, DAY_NAMES[state.activeDay]));
  const exCount = entries.filter(e=>e.type==='exercise').length;
  headLeft.appendChild(el('div','day-count', exCount ? (exCount + (exCount===1?' ejercicio':' ejercicios')) : ''));
  heading.appendChild(headLeft);
  const nKeyHead = noteKey(plan, state.activeDay);
  const exEntriesForNote = entries.filter(e=>e.type==='exercise');
  const hasNote = !!state.notes[nKeyHead] || exEntriesForNote.some((e,exIdx)=>!!state.notes[noteKey(plan, state.activeDay, exIdx)]);
  const noteBtn = el('button', null, hasNote ? '📝 Notas' : '📝 Añadir nota');
  noteBtn.style.cssText = 'background:none;border:1px solid var(--surface-3);color:' + (hasNote?'var(--yellow-deep)':'var(--muted)') + ';font-family:Inter,sans-serif;font-weight:600;font-size:11.5px;padding:6px 11px;border-radius:8px;cursor:pointer;white-space:nowrap;align-self:flex-start;';
  noteBtn.onclick = ()=>{ state.showDayNote = true; state.dayNoteDrafts = null; render(); };
  heading.appendChild(noteBtn);
  const dayReportBtn = el('button', null, '🧾 Informe');
  dayReportBtn.style.cssText = 'background:none;border:1px solid var(--surface-3);color:var(--muted);font-family:Inter,sans-serif;font-weight:600;font-size:11.5px;padding:6px 11px;border-radius:8px;cursor:pointer;white-space:nowrap;align-self:flex-start;';
  dayReportBtn.onclick = ()=>{ generateDayReport(plan, state.activeDay); };
  heading.appendChild(dayReportBtn);
  section.appendChild(heading);

  if (entries.length === 0){
    section.appendChild(el('div','empty-day','Sin datos para este día.'));
  }

  entries.forEach((entry, idx)=>{
    if (entry.type === 'rest'){
      section.appendChild(el('div','note-card', 'Descanso'));
      return;
    }
    if (entry.type === 'note'){
      section.appendChild(el('div','note-card competition', entry.label));
      return;
    }
    section.appendChild(renderExerciseCard(plan, state.activeDay, entry, idx));
  });

  wrap.appendChild(section);

  // debug
  const dbgToggle = el('div','debug-toggle');
  const dbgBtn = document.createElement('button');
  dbgBtn.textContent = state.showDebug ? 'Ocultar datos sin procesar' : '¿Algo no cuadra? Ver datos leídos del archivo';
  dbgBtn.onclick = ()=>{ state.showDebug = !state.showDebug; render(); };
  dbgToggle.appendChild(dbgBtn);
  wrap.appendChild(dbgToggle);
  if (state.showDebug){
    const panel = el('div','debug-panel');
    panel.textContent = JSON.stringify(plan.days, null, 2);
    wrap.appendChild(panel);
  }

  return wrap;
}

function renderExerciseCard(plan, day, entry, idx){
  const card = el('div','ex-card');
  const top = el('div','ex-top');
  top.appendChild(el('div','ex-code', String(entry.code)));
  const info = el('div','ex-info');
  const nameText = entry.name || ('Código ' + entry.code + ' (sin identificar)');
  info.appendChild(el('div','ex-name' + (entry.name?'':' unknown'), nameText));
  const ratings = entry.sets.map((s,si)=>normalizeCheck(state.checks[checkKey(plan,day,idx,si)])).filter(r=>r!==null);
  const subBits = [entry.sets.length + (entry.sets.length===1? ' peso':' pesos')];
  if (ratings.length){
    const avg = ratings.reduce((a,b)=>a+b,0)/ratings.length;
    const avgInfo = ratingInfo(Math.round(avg));
    subBits.push((avgInfo?avgInfo.icon+' ':'') + 'media ' + avg.toFixed(1));
  }
  info.appendChild(el('div','ex-sub', subBits.join(' · ')));
  top.appendChild(info);
  const entryKey = day + '|' + idx;
  const delBtn = el('button', null, '🗑');
  delBtn.style.cssText = 'background:none;border:1px solid var(--surface-3);color:var(--muted);width:34px;height:34px;border-radius:8px;cursor:pointer;flex-shrink:0;font-size:14px;';
  delBtn.onclick = (e)=>{ e.stopPropagation(); state.confirmDeleteExercise = entryKey; render(); };
  top.appendChild(delBtn);
  card.appendChild(top);

  const chips = el('div','set-chips');
  entry.sets.forEach((s, si)=>{
    const rating = normalizeCheck(state.checks[checkKey(plan,day,idx,si)]);
    const rinfo = ratingInfo(rating);
    const chip = el('div','chip');
    if (rinfo){ chip.style.cssText = 'background:'+rinfo.color+';border-color:'+rinfo.color+';color:#fff;'; }
    const repDisplay = s.repsParts ? s.repsParts.join('+') : (s.reps ?? '?');
    chip.innerHTML = '<b>'+s.kg+'kg</b> · ' + (s.series||'?') + '×' + repDisplay + (rinfo ? ' ' + rinfo.icon : '');
    if (rinfo) chip.querySelector('b').style.color = '#fff';
    chip.onclick = (e)=>{ e.stopPropagation(); openFlashcards(day, idx, si); };
    chips.appendChild(chip);
  });
  card.appendChild(chips);

  if (state.confirmDeleteExercise === entryKey){
    const confirmBar = el('div');
    confirmBar.style.cssText = 'display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;padding:10px;background:var(--surface-2);border-radius:10px;';
    const warnTxt = el('span', null, '¿Borrar este ejercicio y sus marcas?');
    warnTxt.style.cssText = 'font-size:12.5px;color:var(--chalk);flex:1;';
    confirmBar.appendChild(warnTxt);
    const yesBtn = el('button', null, 'Sí, borrar');
    yesBtn.style.cssText = 'background:var(--red);border:none;color:#fff8f0;font-family:Oswald,sans-serif;font-weight:700;font-size:12px;padding:8px 12px;border-radius:8px;cursor:pointer;';
    yesBtn.onclick = (e)=>{
      e.stopPropagation();
      deleteExerciseEntry(plan, day, idx);
      state.confirmDeleteExercise = null;
      render();
    };
    const noBtn = el('button', null, 'No');
    noBtn.style.cssText = 'background:none;border:1px solid var(--surface-3);color:var(--muted);font-family:Inter,sans-serif;font-size:12px;padding:8px 12px;border-radius:8px;cursor:pointer;';
    noBtn.onclick = (e)=>{ e.stopPropagation(); state.confirmDeleteExercise = null; render(); };
    confirmBar.appendChild(yesBtn); confirmBar.appendChild(noBtn);
    card.appendChild(confirmBar);
  } else {
    const hint = el('div','ex-hint','Toca un peso para marcarlo · tarjetas ▸');
    card.appendChild(hint);
  }

  // -- Vídeos del ejercicio (análisis de técnica) --
  const videoKey = day + '|' + idx;
  if (!state.exerciseVideos[videoKey]) state.exerciseVideos[videoKey] = [];
  const videos = state.exerciseVideos[videoKey];

  const videoSection = el('div');
  videoSection.style.cssText = 'margin-top:14px;padding-top:14px;border-top:1px solid var(--border);';
  videoSection.onclick = (e)=> e.stopPropagation();

  const videoHeading = el('div');
  videoHeading.style.cssText = 'display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;';
  const vTitle = el('div', null, '🎥 Vídeos' + (videos.length ? ' (' + videos.length + ')' : ''));
  vTitle.style.cssText = 'font-family:Oswald,sans-serif;font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.02em;color:var(--muted);';
  videoHeading.appendChild(vTitle);

  const addVideoLabel = document.createElement('label');
  addVideoLabel.textContent = '+ Añadir vídeo';
  addVideoLabel.style.cssText = 'background:none;border:1px solid var(--surface-3);color:var(--muted);font-family:Inter,sans-serif;font-weight:600;font-size:11px;padding:6px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;';
  const videoInput = document.createElement('input');
  videoInput.type = 'file'; videoInput.accept = 'video/*'; videoInput.multiple = true; videoInput.style.display = 'none';
  videoInput.addEventListener('change', (e)=>{
    Array.from(e.target.files).forEach(file=>{
      const url = URL.createObjectURL(file);
      const looksLikeHevcMov = /\.mov$/i.test(file.name) || file.type === 'video/quicktime';
      videos.push({ id: 'v'+Date.now()+Math.random().toString(36).slice(2,6), name:file.name, url, analysis:null, formatWarning: looksLikeHevcMov });
    });
    render();
  });
  addVideoLabel.appendChild(videoInput);
  videoHeading.appendChild(addVideoLabel);
  videoSection.appendChild(videoHeading);

  if (!videos.length){
    const emptyHint = el('div','ex-hint','Sube el vídeo de una serie para revisarlo o pedir feedback de técnica.');
    videoSection.appendChild(emptyHint);
  } else {
    videos.forEach(v=>{
      const vCard = el('div');
      vCard.style.cssText = 'background:var(--surface-2);border-radius:12px;padding:10px;margin-bottom:10px;';

      const vidEl = document.createElement('video');
      vidEl.src = v.url; vidEl.controls = true; vidEl.playsInline = true;
      vidEl.style.cssText = 'width:100%;border-radius:8px;display:block;background:#000;';
      vCard.appendChild(vidEl);

      if (v.formatWarning){
        const warn = el('div');
        warn.style.cssText = 'margin-top:8px;font-size:12px;line-height:1.5;color:var(--yellow-deep);background:var(--surface);border:1px solid var(--surface-3);border-radius:8px;padding:8px 10px;';
        warn.textContent = '⚠️ Este .MOV puede estar grabado en HEVC de alta eficiencia, que este visor no puede leer. En el iPhone: Ajustes → Cámara → Formatos → "Más compatible" antes de grabar, o conviértelo a .mp4 (H.264) antes de subirlo.';
        vCard.appendChild(warn);
      }

      const vActions = el('div');
      vActions.style.cssText = 'display:flex;gap:8px;margin-top:8px;';
      const analyzing = !!(v.analysis && v.analysis.loading);
      const analyzeBtn = el('button', null, analyzing ? 'Analizando…' : '🔎 Analizar con IA');
      analyzeBtn.style.cssText = 'flex:1;background:var(--surface);border:1px solid var(--surface-3);color:var(--yellow-deep);font-family:Inter,sans-serif;font-weight:600;font-size:12px;padding:9px 0;border-radius:8px;cursor:pointer;';
      if (analyzing) analyzeBtn.disabled = true;
      analyzeBtn.onclick = ()=>{ analyzeVideo(day, idx, v.id); };
      const delVBtn = el('button', null, '🗑');
      delVBtn.style.cssText = 'background:none;border:1px solid var(--surface-3);color:var(--muted);width:38px;border-radius:8px;cursor:pointer;';
      delVBtn.onclick = ()=>{
        URL.revokeObjectURL(v.url);
        state.exerciseVideos[videoKey] = videos.filter(x=>x.id!==v.id);
        render();
      };
      vActions.appendChild(analyzeBtn); vActions.appendChild(delVBtn);
      vCard.appendChild(vActions);

      if (v.analysis){
        if (v.analysis.loading){
          const l = el('div','ex-hint','Extrayendo fotogramas y analizando…');
          l.style.marginTop = '8px';
          vCard.appendChild(l);
        } else if (v.analysis.error){
          const e2 = el('div', null, v.analysis.error);
          e2.style.cssText = 'margin-top:8px;color:var(--red);font-size:12.5px;line-height:1.4;';
          vCard.appendChild(e2);
        } else if (v.analysis.text){
          const t = el('div', null, v.analysis.text);
          t.style.cssText = 'margin-top:8px;font-size:13px;line-height:1.5;color:var(--chalk);';
          vCard.appendChild(t);
        }
      }
      videoSection.appendChild(vCard);
    });
  }
  card.appendChild(videoSection);

  card.onclick = ()=>{
    if (state.confirmDeleteExercise === entryKey) return;
    const firstUnmarked = entry.sets.findIndex((s,si)=>!state.checks[checkKey(plan,day,idx,si)]);
    openFlashcards(day, idx, firstUnmarked>=0 ? firstUnmarked : 0);
  };

  return card;
}

// Borra un peso (serie) concreto de un ejercicio y reindexa sus marcas.
function deleteSetFromEntry(plan, day, exIdx, setIdx){
  const entry = plan.days[day][exIdx];
  entry.sets.splice(setIdx, 1);
  const prefix = plan.id + '|' + day + '|' + exIdx + '|';
  const newChecks = {};
  Object.keys(state.checks).forEach(k=>{
    if (k.startsWith(prefix)){
      const oldSetIdx = parseInt(k.slice(prefix.length), 10);
      if (oldSetIdx === setIdx) return;
      const newSetIdx = oldSetIdx > setIdx ? oldSetIdx-1 : oldSetIdx;
      newChecks[prefix + newSetIdx] = state.checks[k];
    } else {
      newChecks[k] = state.checks[k];
    }
  });
  state.checks = newChecks;
  persistUserData();
}

/* ---- Flashcard viewer ---- */
function openFlashcards(day, exIdx, cardIdx){
  state.flashcard = { day, exIdx, cardIdx: cardIdx||0, dir:null, showMemo:false, memoDraft:undefined, confirmDeleteSetIdx:null };
  render();
}

function renderFlashcardOverlay(plan){
  const { day, exIdx } = state.flashcard;
  const entry = plan.days[day][exIdx];
  const totalCards = entry.sets.length + 1; // + final "what next" card
  let cardIdx = Math.max(0, Math.min(state.flashcard.cardIdx, totalCards-1));
  state.flashcard.cardIdx = cardIdx;
  const isFinal = cardIdx === entry.sets.length;
  const dirClass = state.flashcard.dir==='next' ? ' dir-next' : state.flashcard.dir==='prev' ? ' dir-prev' : '';

  const overlay = el('div','overlay fc-overlay');
  overlay.style.cssText = 'align-items:center;';
  const closeOnBg = (e)=>{ if (e.target===overlay){ state.flashcard=null; state.newWeightDraft=null; render(); } };
  overlay.onclick = closeOnBg;

  const wrap = el('div','fc-wrap');

  const topBar = el('div','fc-top');
  const titleWrap = el('div');
  titleWrap.appendChild(el('div','fc-name', entry.name || ('Código '+entry.code)));
  titleWrap.appendChild(el('div','fc-progress', (cardIdx+1)+' / '+totalCards));
  topBar.appendChild(titleWrap);
  const closeBtn = el('button','fc-close','✕');
  closeBtn.onclick = ()=>{ state.flashcard=null; state.newWeightDraft=null; render(); };
  topBar.appendChild(closeBtn);
  wrap.appendChild(topBar);

  const cardArea = el('div','fc-card-area');

  // navegación con animación de "tarjeta física" que se descarta hacia un lado
  function goToCard(newIdx, dir){
    const c = cardArea.querySelector('.fc-card');
    if (c){
      c.style.animation = 'none';
      c.style.transition = 'transform .16s cubic-bezier(.5,0,.85,.4), opacity .16s linear';
      c.style.transform = dir==='next'
        ? 'translateX(-170px) translateY(10px) rotate(-14deg) scale(.96)'
        : 'translateX(170px) translateY(10px) rotate(14deg) scale(.96)';
      c.style.opacity = '0';
      setTimeout(()=>{ state.flashcard.dir = dir; state.flashcard.cardIdx = newIdx; render(); }, 130);
    } else {
      state.flashcard.dir = dir; state.flashcard.cardIdx = newIdx; render();
    }
  }

  let touchStartX = null, touchDX = 0, dragging = false;
  cardArea.addEventListener('touchstart', e=>{
    touchStartX = e.touches[0].clientX; touchDX = 0; dragging = true;
    const c = cardArea.querySelector('.fc-card');
    if (c){ c.style.animation = 'none'; c.style.transition = 'none'; }
  }, {passive:true});
  cardArea.addEventListener('touchmove', e=>{
    if (!dragging || touchStartX===null) return;
    touchDX = e.touches[0].clientX - touchStartX;
    const c = cardArea.querySelector('.fc-card');
    if (c) c.style.transform = 'translateX('+touchDX+'px) rotate('+(touchDX/14)+'deg)';
  }, {passive:true});
  cardArea.addEventListener('touchend', ()=>{
    dragging = false;
    touchStartX = null;
    const dx = touchDX; touchDX = 0;
    if (Math.abs(dx) < 45){
      const c = cardArea.querySelector('.fc-card');
      if (c){ c.style.transition = 'transform .22s cubic-bezier(.2,.8,.3,1)'; c.style.transform = 'translateX(0) rotate(0deg)'; }
      return;
    }
    if (dx < 0 && cardIdx < totalCards-1) goToCard(cardIdx+1, 'next');
    else if (dx > 0 && cardIdx > 0) goToCard(cardIdx-1, 'prev');
    else {
      const c = cardArea.querySelector('.fc-card');
      if (c){ c.style.transition = 'transform .22s cubic-bezier(.2,.8,.3,1)'; c.style.transform = 'translateX(0) rotate(0deg)'; }
    }
  }, {passive:true});

  if (!isFinal){
    const s = entry.sets[cardIdx];
    const key = checkKey(plan, day, exIdx, cardIdx);
    const status = normalizeCheck(state.checks[key]);

    const card = el('div','fc-card'+dirClass);
    card.appendChild(el('div','fc-kg', s.kg+' kg'));
    const repDisplay = s.repsParts ? s.repsParts.join('+') : (s.reps ?? '?');
    card.appendChild(el('div','fc-setrep', (s.series||'?')+' serie'+((s.series===1)?'':'s')+' × '+repDisplay+' rep'+((s.reps===1)?'':'s')));
    if (entry.parts && entry.parts.length > 1){
      const comboHint = el('div');
      comboHint.style.cssText = 'font-family:Inter,sans-serif;font-size:13px;color:var(--muted);text-align:center;margin-top:-8px;';
      comboHint.textContent = entry.parts.map((p,i)=>{
        const n = s.repsParts ? s.repsParts[i] : null;
        const base = DICT[p.code] || ('Cód. '+p.code);
        return (n!==null&&n!==undefined ? n+'× ' : '') + base + (p.modifier ? ' ('+p.modifier+')' : '');
      }).join(' + ');
      card.appendChild(comboHint);
    }

    const markRow = el('div','fc-mark-row');
    SET_RATING_LEVELS.forEach(level=>{
      const selected = status === level.value;
      const btn = el('button','fc-mark'+(selected?' selected':''), level.icon);
      if (selected){ btn.style.background = level.color; btn.style.borderColor = level.color; }
      btn.onclick = ()=>{
        const wasThis = status === level.value;
        state.checks[key] = wasThis ? null : level.value;
        if (!state.checks[key]) delete state.checks[key];
        persistUserData();
        if (!wasThis && cardIdx < totalCards-1) goToCard(cardIdx+1, 'next');
        else render();
      };
      markRow.appendChild(btn);
    });
    card.appendChild(markRow);

    if (state.flashcard.confirmDeleteSetIdx === cardIdx){
      const confirmRow = el('div');
      confirmRow.style.cssText = 'display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap;justify-content:center;';
      const txt = el('span', null, '¿Borrar este peso?');
      txt.style.cssText = 'font-size:12.5px;color:var(--muted);';
      const yesBtn = el('button', null, 'Sí, borrar');
      yesBtn.style.cssText = 'background:var(--red);border:none;color:#fff8f0;font-family:Oswald,sans-serif;font-weight:700;font-size:12px;padding:8px 14px;border-radius:8px;cursor:pointer;';
      yesBtn.onclick = ()=>{
        deleteSetFromEntry(plan, day, exIdx, cardIdx);
        state.flashcard.confirmDeleteSetIdx = null;
        state.flashcard.cardIdx = Math.min(cardIdx, entry.sets.length);
        render();
      };
      const noBtn = el('button', null, 'No');
      noBtn.style.cssText = 'background:none;border:1px solid var(--surface-3);color:var(--muted);font-family:Inter,sans-serif;font-size:12px;padding:8px 14px;border-radius:8px;cursor:pointer;';
      noBtn.onclick = ()=>{ state.flashcard.confirmDeleteSetIdx = null; render(); };
      confirmRow.appendChild(txt); confirmRow.appendChild(yesBtn); confirmRow.appendChild(noBtn);
      card.appendChild(confirmRow);
    } else {
      const delSetBtn = el('button', null, '🗑 Borrar este peso');
      delSetBtn.style.cssText = 'background:none;border:none;color:var(--muted-2);font-family:Inter,sans-serif;font-size:12.5px;text-decoration:underline;cursor:pointer;margin-top:4px;';
      delSetBtn.onclick = ()=>{ state.flashcard.confirmDeleteSetIdx = cardIdx; render(); };
      card.appendChild(delSetBtn);
    }

    cardArea.appendChild(card);
  } else if (state.flashcard.showMemo){
    const nKey = noteKey(plan, day, exIdx);
    const savedNote = normalizeNote(state.notes[nKey]);
    if (state.flashcard.memoDraft === undefined){
      state.flashcard.memoDraft = { text: savedNote.text, rpe: savedNote.rpe, feeling: savedNote.feeling };
    }
    const draft = state.flashcard.memoDraft;
    const card = el('div','fc-card fc-final'+dirClass);
    card.appendChild(el('div','fc-final-title','Nota de este ejercicio'));
    card.appendChild(el('div','fc-final-sub','Calor, alimentación, cómo has dormido… cualquier cosa que creas que ha influido hoy.'));
    card.appendChild(feelingSelector(draft.feeling, v=>{ draft.feeling = v; render(); }));
    card.appendChild(rpeInput(draft.rpe, v=>{ draft.rpe = v; }));
    const ta = document.createElement('textarea');
    ta.value = draft.text || '';
    ta.rows = 4;
    ta.placeholder = 'Ej. Mucho calor en el gimnasio, dormí poco, comí tarde…';
    ta.className = 'fc-memo-textarea';
    ta.addEventListener('input', e=>{ draft.text = e.target.value; });
    card.appendChild(ta);

    const actions = el('div','fc-final-actions');
    const skipBtn = el('button','mark-btn','Cerrar sin guardar');
    skipBtn.onclick = ()=>{ state.flashcard=null; render(); };
    const saveBtn = el('button','mark-btn ok selected','Guardar nota');
    saveBtn.onclick = ()=>{
      const text = ta.value.trim();
      if (text || draft.rpe!==null || draft.feeling!==null) state.notes[nKey] = { text, rpe: draft.rpe, feeling: draft.feeling };
      else delete state.notes[nKey];
      persistUserData();
      state.flashcard = null;
      render();
    };
    actions.appendChild(skipBtn); actions.appendChild(saveBtn);
    card.appendChild(actions);
    cardArea.appendChild(card);
  } else {
    const card = el('div','fc-card fc-final'+dirClass);
    card.appendChild(el('div','fc-final-title','Ejercicio completo'));
    card.appendChild(el('div','fc-final-sub','¿Subimos de peso o lo dejamos aquí?'));

    if (!state.newWeightDraft){
      const btnRow = el('div','fc-final-actions');
      const addBtn = el('button','mark-btn ok selected','+ Nuevo peso');
      addBtn.onclick = ()=>{
        const last = entry.sets[entry.sets.length-1] || {kg:null,series:null,reps:null};
        state.newWeightDraft = { kg:last.kg, series:last.series, reps:last.reps };
        render();
      };
      const doneBtn = el('button','mark-btn','Finalizar');
      doneBtn.onclick = ()=>{
        state.flashcard.showMemo = true;
        state.flashcard.memoDraft = undefined;
        render();
      };
      btnRow.appendChild(addBtn); btnRow.appendChild(doneBtn);
      card.appendChild(btnRow);
    } else {
      const form = el('div','fc-newweight-form');
      const mk = (label, field, width)=>{
        const wrapF = el('div','fc-field');
        wrapF.appendChild(el('div','fc-field-label', label));
        const inp = document.createElement('input');
        inp.type = 'text'; inp.inputMode='numeric';
        inp.value = state.newWeightDraft[field] ?? '';
        inp.style.width = width+'px';
        inp.className = 'fc-field-input';
        inp.addEventListener('change', ()=>{
          const v = inp.value.trim();
          state.newWeightDraft[field] = v==='' ? null : Number(v.replace(',','.'));
        });
        wrapF.appendChild(inp);
        return wrapF;
      };
      form.appendChild(mk('KG','kg',70));
      form.appendChild(mk('Series','series',60));
      form.appendChild(mk('Repes','reps',60));
      card.appendChild(form);

      const confirmRow = el('div','fc-final-actions');
      const cancelBtn = el('button','mark-btn','Cancelar');
      cancelBtn.onclick = ()=>{ state.newWeightDraft=null; render(); };
      const saveBtn = el('button','mark-btn ok selected','Añadir');
      saveBtn.onclick = ()=>{
        const nw = state.newWeightDraft;
        if (nw.kg===null || nw.kg===undefined || isNaN(nw.kg)){ return; }
        entry.sets.push({ kg:nw.kg, series:nw.series??null, reps:nw.reps??null });
        persistUserData();
        state.newWeightDraft = null;
        state.flashcard.cardIdx = entry.sets.length-1; // jump straight to the new set's card
        render();
      };
      confirmRow.appendChild(cancelBtn); confirmRow.appendChild(saveBtn);
      card.appendChild(confirmRow);
    }
    cardArea.appendChild(card);
  }
  wrap.appendChild(cardArea);

  const navRow = el('div','fc-nav');
  const prevBtn = el('button','fc-nav-btn','‹');
  prevBtn.disabled = cardIdx===0;
  prevBtn.onclick = ()=>{ if (cardIdx>0) goToCard(cardIdx-1, 'prev'); };
  const dots = el('div','fc-dots');
  for (let i=0;i<totalCards;i++){
    dots.appendChild(el('div','fc-dot'+(i===cardIdx?' active':'')));
  }
  const nextBtn = el('button','fc-nav-btn','›');
  nextBtn.disabled = cardIdx===totalCards-1;
  nextBtn.onclick = ()=>{ if (cardIdx<totalCards-1) goToCard(cardIdx+1, 'next'); };
  navRow.appendChild(prevBtn); navRow.appendChild(dots); navRow.appendChild(nextBtn);
  wrap.appendChild(navRow);

  overlay.appendChild(wrap);
  return overlay;
}

/* ---- Analytics ---- */
function buildAnalytics(){
  const byCode = {};
  const plansSorted = [...state.plans].filter(p=>!p.needsReview).sort((a,b)=>{
    const wa = typeof a.meta.week === 'number' ? a.meta.week : null;
    const wb = typeof b.meta.week === 'number' ? b.meta.week : null;
    if (wa!==null && wb!==null && wa!==wb) return wa-wb;
    return a.uploadedAt - b.uploadedAt;
  });
  plansSorted.forEach(plan=>{
    const perCodeThisPlan = {};
    DAY_ORDER.forEach(day=>{
      const entries = plan.days[day]; if (!entries) return;
      entries.forEach((entry,exIdx)=>{
        if (entry.type!=='exercise') return;
        if (!perCodeThisPlan[entry.code]) perCodeThisPlan[entry.code] = { name: entry.name, kgs:[], ratings:[] };
        entry.sets.forEach((s,si)=>{
          if (s.kg!==null && s.kg!==undefined) perCodeThisPlan[entry.code].kgs.push(s.kg);
          const r = normalizeCheck(state.checks[checkKey(plan,day,exIdx,si)]);
          if (r!==null) perCodeThisPlan[entry.code].ratings.push(r);
        });
      });
    });
    Object.keys(perCodeThisPlan).forEach(code=>{
      if (!byCode[code]) byCode[code] = { name: perCodeThisPlan[code].name, points: [] };
      const c = perCodeThisPlan[code];
      if (c.kgs.length === 0) return;
      byCode[code].points.push({
        label: (plan.meta.week!==null && plan.meta.week!==undefined) ? ('S'+plan.meta.week) : new Date(plan.uploadedAt).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'}),
        maxKg: Math.max(...c.kgs),
        ratings: c.ratings
      });
    });
  });
  return byCode;
}

function sparklineSVG(points){
  const width = 280, height = 100, padX = 16, padY = 16;
  const kgs = points.map(p=>p.maxKg);
  const min = Math.min(...kgs), max = Math.max(...kgs);
  const range = (max-min) || 1;
  const stepX = points.length>1 ? (width-2*padX)/(points.length-1) : 0;
  const coords = points.map((p,i)=>{
    const x = padX + i*stepX;
    const y = height-padY - ((p.maxKg-min)/range)*(height-2*padY);
    return { x, y, p };
  });
  const pathD = coords.map((c,i)=> (i===0?'M':'L')+c.x.toFixed(1)+','+c.y.toFixed(1)).join(' ');
  const dots = coords.map(c=>{
    let color = '#8892a0';
    if (c.p.ratings && c.p.ratings.length){
      const avg = c.p.ratings.reduce((a,b)=>a+b,0)/c.p.ratings.length;
      const info = ratingInfo(Math.round(avg));
      if (info) color = info.color;
    }
    return '<circle cx="'+c.x.toFixed(1)+'" cy="'+c.y.toFixed(1)+'" r="4.5" fill="'+color+'" stroke="#ffffff" stroke-width="1.5"/>';
  }).join('');
  const labels = coords.map(c=>
    '<text x="'+c.x.toFixed(1)+'" y="'+(height-2)+'" font-size="9" fill="#6b7482" text-anchor="middle" font-family="IBM Plex Mono, monospace">'+c.p.label+'</text>'
  ).join('');
  return '<svg width="100%" height="'+height+'" viewBox="0 0 '+width+' '+height+'" preserveAspectRatio="xMidYMid meet">'+
    '<path d="'+pathD+'" fill="none" stroke="#3f6f9f" stroke-width="2.5"/>'+dots+labels+'</svg>';
}

/* ---- Regresión lineal simple, para proyectar la evolución del RM ---- */
function linearRegression(points){
  const n = points.length;
  if (n < 2) return null;
  const sumX = points.reduce((a,p)=>a+p.x,0);
  const sumY = points.reduce((a,p)=>a+p.y,0);
  const sumXY = points.reduce((a,p)=>a+p.x*p.y,0);
  const sumXX = points.reduce((a,p)=>a+p.x*p.x,0);
  const denom = (n*sumXX - sumX*sumX);
  if (denom === 0) return null;
  const slope = (n*sumXY - sumX*sumY) / denom;
  const intercept = (sumY - slope*sumX) / n;
  return { slope, intercept };
}

/* ---- Predicción de cuándo se alcanzará el objetivo de un ejercicio,
   a partir de la tendencia de los RM registrados ---- */
function goalProjectionText(u, code){
  const goal = u.objetivos && u.objetivos.metas ? u.objetivos.metas[code] : null;
  if (!goal) return null;
  const entries = ((u.rms && u.rms[code]) || []).slice().sort((a,b)=>a.date-b.date);
  if (entries.length < 2){
    return { text: 'Registra al menos 2 RM en fechas distintas para poder predecir cuándo llegarás al objetivo.', tone: 'muted' };
  }
  const latest = entries[entries.length-1];
  if (latest.value >= goal){
    return { text: '🎉 Objetivo ya alcanzado (' + latest.value + 'kg).', tone: 'ok' };
  }
  const t0 = entries[0].date;
  const points = entries.map(e=>({ x: (e.date-t0)/86400000, y: e.value }));
  const reg = linearRegression(points);
  if (!reg || reg.slope <= 0.001){
    return { text: 'Con la tendencia actual entre tus registros, el peso no está subiendo — te costará llegar al objetivo si no cambia el ritmo.', tone: 'warn' };
  }
  const xTargetDays = (goal - reg.intercept) / reg.slope;
  const targetTimestamp = t0 + xTargetDays*86400000;
  const daysFromNow = Math.round((targetTimestamp - Date.now()) / 86400000);
  if (daysFromNow <= 0){
    return { text: 'Según tu progreso, deberías estar muy cerca del objetivo ya.', tone: 'ok' };
  }
  const targetDate = new Date(Date.now() + daysFromNow*86400000);
  const weeks = Math.max(1, Math.round(daysFromNow/7));
  const dateStr = targetDate.toLocaleDateString('es-ES', { day:'2-digit', month:'long', year:'numeric' });
  const kgPerWeek = (reg.slope*7).toFixed(2);
  const confidence = entries.length >= 4 ? '' : ' (estimación con pocos datos — se ajustará con más registros)';
  return { text: 'A este ritmo (~' + kgPerWeek + ' kg/semana), llegarías a ' + goal + 'kg hacia el ' + dateStr + ' (~' + weeks + (weeks===1?' semana':' semanas') + ')' + confidence + '.', tone: 'ok' };
}

/* ---- Pesos ya registrados en los entrenos, para poder usarlos como RM ---- */
function trainingEntriesForCode(code){
  const out = [];
  state.plans.forEach(plan=>{
    DAY_ORDER.forEach(day=>{
      const dayEntries = plan.days[day]; if (!dayEntries) return;
      dayEntries.forEach((entry, exIdx)=>{
        if (entry.type!=='exercise' || entry.code!==code) return;
        entry.sets.forEach((s, si)=>{
          if (s.kg===null || s.kg===undefined) return;
          const status = normalizeCheck(state.checks[checkKey(plan, day, exIdx, si)]);
          out.push({ kg: s.kg, week: plan.meta && plan.meta.week, uploadedAt: plan.uploadedAt, ok: status!==null && status>=4 });
        });
      });
    });
  });
  return out;
}

function trainingMaxEntryForCode(code){
  const entries = trainingEntriesForCode(code);
  if (!entries.length) return null;
  const ok = entries.filter(e=>e.ok);
  const pool = ok.length ? ok : entries;
  let best = pool[0];
  pool.forEach(e=>{ if (e.kg > best.kg) best = e; });
  return best;
}

    const rmEntries = (u.rms && u.rms[code]) || [];
    const trainMax = trainingMaxEntryForCode(code);
    let currentVal = null, currentSrc = null;
    if (rmEntries.length){ currentVal = rmEntries[rmEntries.length-1].value; currentSrc = 'RM'; }
    else if (trainMax){ currentVal = trainMax.kg; currentSrc = 'entreno'; }

    const status = el('div');
    status.style.cssText = 'font-family:IBM Plex Mono,monospace;font-size:12.5px;color:var(--muted);';
    const goal = u.objetivos.metas[code];
    if (currentVal!==null){
      if (goal){
        const diff = goal - currentVal;
        status.textContent = 'Actual: ' + currentVal + 'kg (' + currentSrc + ') · faltan ' + (diff>0?diff:0) + 'kg';
      } else {
        status.textContent = 'Actual: ' + currentVal + 'kg (' + currentSrc + ')';
      }
    } else {
      status.textContent = 'Sin datos todavía';
    }
    inputRow.appendChild(status);
    row.appendChild(inputRow);

    const proj = goalProjectionText(u, code);
    if (proj){
      const projEl = el('div');
      projEl.style.cssText = 'font-family:Inter,sans-serif;font-size:12.5px;margin-top:6px;line-height:1.4;' +

      projEl.textContent = proj.text;
      row.appendChild(projEl);
    }

    objCard.appendChild(row);
  });
  section.appendChild(objCard);

  /* -- Peso y tensión -- */
  if (!u.metrics) u.metrics = [];

  metricsHeading.appendChild(el('h2', null, 'Peso y tensión'));

    const formCard = el('div','ex-card');
    formCard.style.cursor = 'default';

    dateI.type = 'date'; dateI.value = state.metricForm.date;
    dateI.style.cssText = 'width:100%;background:var(--surface-2);border:1px solid var(--surface-3);border-radius:7px;color:var(--chalk);font-family:IBM Plex Mono,monospace;font-size:13px;padding:9px 8px;';

    const pesoI = reviewMiniInput(state.metricForm.peso, 'kg', 90, v=>{ state.metricForm.peso = v; });

    const lbl2 = el('div','fc-field-label','Tensión (mmHg)'); lbl2.style.cssText='margin-top:12px;margin-bottom:5px;';
    formCard.appendChild(lbl2);
    const row3 = el('div'); row3.style.cssText = 'display:flex;gap:8px;align-items:center;';
    const sysI = reviewMiniInput(state.metricForm.sistolica, 'sistólica', 80, v=>{ state.metricForm.sistolica = v; });
    const slash = el('span', null, '/'); slash.style.color = 'var(--muted-2)';
    const diaI = reviewMiniInput(state.metricForm.diastolica, 'diastólica', 80, v=>{ state.metricForm.diastolica = v; });
    row3.appendChild(sysI); row3.appendChild(slash); row3.appendChild(diaI);
    formCard.appendChild(row3);

    const saveBtn = el('button','mark-btn ok selected','Guardar medida');
    saveBtn.style.cssText += 'margin-top:14px;width:100%;';

      const ts = (new Date(state.metricForm.date)).getTime() || Date.now();
      u.metrics.push({
        date: ts,

        sistolica: (sys!==null && !isNaN(sys)) ? sys : null,
        diastolica: (dia!==null && !isNaN(dia)) ? dia : null
      });

    section.appendChild(formCard);
  }

  const weightEntries = u.metrics.filter(m=>m.peso!==null && m.peso!==undefined).map(m=>({ value:m.peso, date:m.date }));

      wCard.appendChild(cw);
    }

  }

  const tensionEntries = u.metrics.filter(m=>m.sistolica!==null && m.sistolica!==undefined && m.diastolica!==null && m.diastolica!==undefined);
  if (tensionEntries.length){
    const tCard = el('div','ex-card');
    tCard.style.cursor = 'default';
    tCard.appendChild(el('div','ex-name','Tensión arterial'));
    const latestT = tensionEntries[tensionEntries.length-1];
    tCard.appendChild(el('div','ex-sub','Última: ' + latestT.sistolica + '/' + latestT.diastolica + ' mmHg · ' + new Date(latestT.date).toLocaleDateString('es-ES')));
    if (tensionEntries.length >= 2){
      const ct = el('div'); ct.style.cssText = 'margin:12px 0 4px 0;';

    listCard.appendChild(el('div','day-count','HISTORIAL DE MEDIDAS'));

      const mid = el('div');
      mid.style.cssText = 'font-family:IBM Plex Mono,monospace;font-size:13px;color:var(--chalk);flex:1;text-align:right;';

      if (m.sistolica!==null && m.sistolica!==undefined && m.diastolica!==null && m.diastolica!==undefined) bits.push(m.sistolica+'/'+m.diastolica);
      mid.textContent = bits.join(' · ');
      const delBtn = el('button', null, '✕');
      delBtn.style.cssText = 'background:none;border:none;color:var(--muted-2);font-size:14px;cursor:pointer;padding:4px 8px;flex-shrink:0;';
      delBtn.onclick = ()=>{ u.metrics = u.metrics.filter(x=>x!==m); saveUsersAsync(users); render(); };
      row.appendChild(left); row.appendChild(mid); row.appendChild(delBtn);
      listCard.appendChild(row);
    });
    section.appendChild(listCard);
  } else if (!state.metricForm){
    section.appendChild(el('div','empty-day','Todavía no has registrado peso ni tensión. Usa "+ Registrar medida" para empezar.'));
  }

  /* -- Mis RM -- */
  const rmHeading = el('div','day-heading');
  rmHeading.appendChild(el('h2', null, 'Mis RM'));
  const addRmBtn = el('button','tb-btn', state.rmForm ? 'Cancelar' : '+ Registrar RM');
  addRmBtn.onclick = ()=>{
    state.rmForm = state.rmForm ? null : { code:null, value:'', date: new Date().toISOString().slice(0,10) };
    render();
  };
  rmHeading.appendChild(addRmBtn);
  section.appendChild(rmHeading);

  if (state.rmForm){
    const formCard = el('div','ex-card');
    formCard.style.cursor = 'default';
    formCard.appendChild(dictSelect(state.rmForm.code, v=>{ state.rmForm.code = v; render(); }));

    if (state.rmForm.code){
      const tMax = trainingMaxEntryForCode(state.rmForm.code);
      if (tMax){
        const hintBtn = el('button', null, '📋 Usar de mis entrenos: ' + tMax.kg + 'kg' +
          (tMax.week!==null && tMax.week!==undefined ? ' (semana ' + tMax.week + ')' : ''));
        hintBtn.style.cssText = 'background:none;border:1px dashed var(--surface-3);color:var(--yellow-deep);font-family:Inter,sans-serif;font-weight:600;font-size:12px;padding:9px 10px;border-radius:8px;cursor:pointer;margin-top:10px;width:100%;';
        hintBtn.onclick = ()=>{
          state.rmForm.value = String(tMax.kg);
          state.rmForm.date = new Date(tMax.uploadedAt).toISOString().slice(0,10);
          render();
        };
        formCard.appendChild(hintBtn);
      } else {
        const noHint = el('div','ex-hint');
        noHint.style.cssText = 'margin-top:10px;';
        noHint.textContent = 'No hay pesos de entreno guardados para este ejercicio todavía — introdúcelo a mano.';
        formCard.appendChild(noHint);
      }
    }

    const row2 = el('div'); row2.style.cssText = 'display:flex;gap:8px;margin-top:10px;align-items:center;';
    const kgI = reviewMiniInput(state.rmForm.value, 'kg', 70, v=>{ state.rmForm.value = v; });
    const dateI = document.createElement('input');
    dateI.type = 'date'; dateI.value = state.rmForm.date;
    dateI.style.cssText = 'flex:1;background:var(--surface-2);border:1px solid var(--surface-3);border-radius:7px;color:var(--chalk);font-family:IBM Plex Mono,monospace;font-size:13px;padding:7px 6px;';
    dateI.addEventListener('change', (e)=>{ state.rmForm.date = e.target.value; });
    row2.appendChild(kgI); row2.appendChild(dateI);
    formCard.appendChild(row2);
    const saveBtn = el('button','mark-btn ok selected','Guardar RM');
    saveBtn.style.cssText += 'margin-top:12px;width:100%;';
    saveBtn.onclick = ()=>{
      const code = state.rmForm.code;
      const value = Number(String(state.rmForm.value).replace(',','.'));
      if (!code || !value){ return; }
      if (!u.rms[code]) u.rms[code] = [];
      u.rms[code].push({ value, date: (new Date(state.rmForm.date)).getTime() || Date.now() });
      u.rms[code].sort((a,b)=>a.date-b.date);
      saveUsersAsync(users);
      state.rmForm = null;
      render();
    };
    formCard.appendChild(saveBtn);
    section.appendChild(formCard);
  }

  const codesWithRm = Object.keys(u.rms||{}).filter(c=>u.rms[c] && u.rms[c].length).map(Number).sort((a,b)=>a-b);
  if (!codesWithRm.length){
    section.appendChild(el('div','empty-day','Todavía no has registrado ningún RM. Usa "+ Registrar RM" para empezar.'));
  }
  codesWithRm.forEach(code=>{
    const entries = u.rms[code];
    const card = el('div','ex-card');
    card.style.cursor = 'default';
    const top2 = el('div','ex-top');
    top2.appendChild(el('div','ex-code', code));
    const info = el('div','ex-info');
    info.appendChild(el('div','ex-name', DICT[code] || ('Código '+code)));
    const latest = entries[entries.length-1];
    info.appendChild(el('div','ex-sub', 'RM actual: ' + latest.value + ' kg · ' + new Date(latest.date).toLocaleDateString('es-ES')));
    top2.appendChild(info);
    const delLatestBtn = el('button', null, '✕');
    delLatestBtn.title = 'Borrar el último registro';
    delLatestBtn.style.cssText = 'background:none;border:1px solid var(--surface-3);color:var(--muted);border-radius:8px;width:34px;height:34px;cursor:pointer;flex-shrink:0;';
    delLatestBtn.onclick = ()=>{
      entries.pop();
      if (!entries.length) delete u.rms[code];
      saveUsersAsync(users);
      render();
    };
    top2.appendChild(delLatestBtn);
    card.appendChild(top2);
    if (entries.length >= 2){
      const chartWrap = el('div'); chartWrap.style.cssText = 'margin:12px 0 4px 0;';
      chartWrap.innerHTML = rmHistorySVG(entries);
      card.appendChild(chartWrap);
    }
    section.appendChild(card);
  });

  /* -- Comparativa entre ejercicios -- */
  const cmpHeading = el('div','day-heading');
  cmpHeading.appendChild(el('h2', null, 'Comparativa entre ejercicios'));
  section.appendChild(cmpHeading);
  const cmpCard = el('div','ex-card');
  cmpCard.style.cursor = 'default';
  cmpCard.appendChild(exerciseCompareBars());
  section.appendChild(cmpCard);

  wrap.appendChild(section);
  return wrap;
}

/* ============== COPIA DE SEGURIDAD ============== */
// Aunque ahora los datos se guardan en el almacén persistente de Claude
// (window.storage) en vez de localStorage, sigue sin haber ninguna copia
// fuera de esta app: si algo fallara con ese almacén, la única red de
// seguridad real es exportar de vez en cuando este .json con TODOS los
// usuarios, sus planes, marcas, notas, RM y objetivos.

function anyUserHasData(){
  return users.some(u=>{
    const cached = userDataCache[u.id];
    if (cached && cached.plans && cached.plans.length) return true;
    if (u.rms && Object.keys(u.rms).length) return true;
    if (u.metrics && u.metrics.length) return true;
    return false;
  });
}

async function buildBackupObject(){
  const backup = { version:1, exportedAt: Date.now(), activeUserId: activeUserId, users: users, data: {} };
  for (const u of users){
    backup.data[u.id] = userDataCache[u.id] || await loadUserDataAsync(u.id);
  }
  return backup;
}

async function exportBackup(){
  const backup = await buildBackupObject();
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = 'mi-plan-halterofilia-backup-' + stamp + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  lastBackupTs = Date.now();
  storageSet(LAST_BACKUP_KEY, String(lastBackupTs));
}

function importBackupFile(file){
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const backup = JSON.parse(e.target.result);
      if (!backup || !Array.isArray(backup.users) || !backup.users.length){
        throw new Error('el archivo no tiene el formato esperado');
      }
      for (const u of backup.users){
        const d = (backup.data && backup.data[u.id]) || { plans:[], checks:{}, notes:{} };
        await saveUserDataAsync(u.id, { plans: d.plans||[], checks: d.checks||{}, notes: d.notes||{} });
      }
      users = backup.users;
      await saveUsersAsync(users);
      const restoredActive = (backup.activeUserId && users.find(u=>u.id===backup.activeUserId))
        ? backup.activeUserId : users[0].id;
      activeUserId = restoredActive;
      await saveActiveUserIdAsync(activeUserId);
      const data = await loadUserDataAsync(activeUserId);
      state.plans = data.plans;
      state.checks = data.checks;
      state.notes = data.notes;
      const sorted = [...state.plans].sort((a,b)=>a.uploadedAt-b.uploadedAt);
      state.activePlanId = sorted.length ? sorted[sorted.length-1].id : null;
      state.activeDay = null;
      state.reviewDismissed = sorted.length ? !sorted[sorted.length-1].needsReview : false;
      state.backupMessage = { text:'Copia restaurada correctamente.', tone:'ok' };
      render();
    }catch(err){
      state.backupMessage = { text:'No he podido leer ese archivo de copia de seguridad (' + (err && err.message ? err.message : 'error desconocido') + ').', tone:'warn' };
      render();
    }
  };
  reader.readAsText(file);
}

/* ---- Ver/copiar el JSON de la copia a mano (si la descarga falla) ---- */
function renderBackupTextOverlay(){
  const overlay = el('div','overlay');
  const close = ()=>{ state.showBackupText = false; render(); };
  overlay.onclick = (e)=>{ if (e.target===overlay) close(); };
  const sheet = el('div','sheet');
  sheet.appendChild(el('h3','Copia de seguridad (texto)'));

  const hint = el('div','ex-hint');
  hint.style.cssText = 'margin-bottom:10px;';
  hint.textContent = 'Copia todo este texto y pégalo en una nota o archivo de texto, guárdalo con extensión .json (por ejemplo "backup.json"), y ese será el archivo que subas después en "Restaurar copia".';
  sheet.appendChild(hint);

  const jsonText = state.backupText || '';
  const ta = document.createElement('textarea');
  ta.value = jsonText;
  ta.readOnly = true;
  ta.rows = 10;
  ta.className = 'fc-memo-textarea';
  ta.style.fontFamily = "'IBM Plex Mono', monospace";
  ta.style.fontSize = '11px';
  ta.onclick = ()=>{ ta.focus(); ta.select(); };
  sheet.appendChild(ta);

  const copyBtn = el('button','mark-btn ok selected','📋 Copiar todo');
  copyBtn.style.cssText += 'margin-top:12px;width:100%;';
  copyBtn.onclick = ()=>{
    ta.focus(); ta.select();
    let copied = false;
    try{
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(jsonText);
        copied = true;
      }
    }catch(e){}
    if (!copied){
      try{ document.execCommand('copy'); copied = true; }catch(e){}
    }
    copyBtn.textContent = copied ? '✓ Copiado' : 'Selecciona y copia a mano';
    setTimeout(()=>{ copyBtn.textContent = '📋 Copiar todo'; }, 2000);
  };
  sheet.appendChild(copyBtn);

  const closeBtn = el('button','sheet-close','Cerrar');
  closeBtn.onclick = close;
  sheet.appendChild(closeBtn);
  overlay.appendChild(sheet);
  return overlay;
}

  overlay.onclick = (e)=>{ if (e.target===overlay) close(); };
  const sheet = el('div','sheet');

  if (syncStatus==='on'){
    const okBox = el('div');
    okBox.style.cssText = 'background:var(--surface-2);border-radius:10px;padding:14px;margin-bottom:14px;';
    const okLine = el('div', null, '✓ Sincronizando');
    okLine.style.cssText = 'color:var(--ok);font-weight:600;';
    okBox.appendChild(okLine);
    const codeRow = el('div', null, syncCode);
    codeRow.style.cssText = 'font-family:IBM Plex Mono,monospace;font-size:16px;margin-top:8px;color:var(--chalk);';
    okBox.appendChild(codeRow);
    const hint = el('div','ex-hint');
    hint.style.cssText = 'margin-top:8px;';
    hint.textContent = 'Introduce este mismo código en tus otros dispositivos para que compartan estos datos.';
    okBox.appendChild(hint);
    sheet.appendChild(okBox);

    const copyBtn = el('button','tb-btn','📋 Copiar código');
    copyBtn.style.width = '100%';
    copyBtn.onclick = async ()=>{
      let copied = false;
      try{ if (navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(syncCode); copied = true; } }catch(e){}
      if (!copied){
        try{
          const ta = document.createElement('textarea');
          ta.value = syncCode; ta.style.position='fixed'; ta.style.opacity='0';
          document.body.appendChild(ta); ta.focus(); ta.select();
          document.execCommand('copy'); document.body.removeChild(ta);
          copied = true;
        }catch(e){}
      }
      copyBtn.textContent = copied ? '✓ Copiado' : 'No se pudo copiar';
      setTimeout(()=>{ copyBtn.textContent = '📋 Copiar código'; }, 2000);
    };
    sheet.appendChild(copyBtn);

    const stopBtn = el('button','tb-btn','Desactivar en este dispositivo');
    stopBtn.style.cssText = 'width:100%;margin-top:8px;color:var(--red);';
    stopBtn.onclick = ()=>{ stopSync(); };
    sheet.appendChild(stopBtn);
  } else {
    const hint = el('div','ex-hint');
    hint.style.cssText = 'margin-bottom:12px;';
    hint.textContent = 'Crea un código (o usa uno que ya tengas de otro dispositivo tuyo) para que todos compartan los mismos datos, casi en tiempo real.';
    sheet.appendChild(hint);

    const inp = document.createElement('input');
    inp.type = 'text'; inp.placeholder = 'Ej. rafa-halter-2026';
    inp.value = state.syncCodeDraft || '';
    inp.style.cssText = 'width:100%;background:var(--surface-2);border:1px solid var(--surface-3);border-radius:8px;color:var(--chalk);font-family:IBM Plex Mono,monospace;font-size:14px;padding:10px;';
    inp.addEventListener('input', e=>{ state.syncCodeDraft = e.target.value; });
    sheet.appendChild(inp);

    if (syncStatus==='connecting'){
      const l = el('div','ex-hint','Conectando…'); l.style.marginTop='8px';
      sheet.appendChild(l);
    } else if (syncStatus==='error'){
      const err = el('div', null, 'No se ha podido conectar. Comprueba tu conexión e inténtalo de nuevo.');
      err.style.cssText = 'color:var(--red);font-size:12.5px;margin-top:8px;line-height:1.4;';
      sheet.appendChild(err);
    }

    const startBtn = el('button','mark-btn ok selected','Activar sincronización');
    startBtn.style.cssText += 'width:100%;margin-top:12px;';
    startBtn.onclick = ()=>{
      const code = (state.syncCodeDraft||'').trim();
      if (!code) return;
      startSync(code);
    };
    sheet.appendChild(startBtn);
  }

  const closeBtn = el('button','sheet-close','Cerrar');
  closeBtn.onclick = close;
  sheet.appendChild(closeBtn);
  overlay.appendChild(sheet);
  return overlay;
}

/* ============== INFORMES (día y semana) ==============
   Usan la API de Claude para sintetizar, en un par de frases, cómo las notas
   libres del atleta (calor, sueño, alimentación...) pueden haberse
   relacionado con el entreno. No se guardan: se generan al vuelo cada vez. */
/* ============== VÍDEOS DE EJERCICIO (análisis de técnica) ==============
   Los vídeos viven solo en memoria del navegador (URL.createObjectURL), no
   se guardan en localStorage ni entran en la copia de seguridad: un vídeo
   pesa demasiado para ese almacenamiento. Al analizar, se extraen unos
   fotogramas del vídeo y se envían a la API de Claude para un feedback de
   técnica; el vídeo en sí nunca sale del navegador salvo esos fotogramas. */

function extractVideoFrames(videoUrl, count){
  return new Promise((resolve, reject)=>{
    const video = document.createElement('video');
    video.src = videoUrl;
    video.muted = true;
    video.playsInline = true;
    video.preload = 'auto';

    const timeout = setTimeout(()=>{
      reject(new Error('tiempo de espera agotado leyendo el vídeo'));
    }, 15000);
    const finish = (fn, arg)=>{ clearTimeout(timeout); fn(arg); };

    video.addEventListener('error', ()=> finish(reject, new Error('no se pudo leer el archivo de vídeo')));

    function startCapture(duration){
      if (!isFinite(duration) || duration <= 0){
        finish(reject, new Error('no se pudo determinar la duración del vídeo'));
        return;
      }
      const times = [];
      for (let i=1; i<=count; i++) times.push(Math.max(0, Math.min(duration-0.05, duration*i/(count+1))));
      const canvas = document.createElement('canvas');
      const frames = [];
      let idx = 0;
      function captureNext(){
        if (idx >= times.length){
          if (!frames.length){ finish(reject, new Error('no se pudo generar ningún fotograma del vídeo')); return; }
          finish(resolve, frames);
          return;
        }
        video.currentTime = times[idx];
      }
      video.addEventListener('seeked', function onSeeked(){
        try{
          const w = video.videoWidth, h = video.videoHeight;
          if (w && h){
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
            frames.push(dataUrl.split(',')[1]);
          }
        }catch(e){ /* fotograma no legible: se salta y se sigue con el siguiente */ }
        idx++;
        captureNext();
      });
      captureNext();
    }

    video.addEventListener('loadedmetadata', ()=>{
      const d = video.duration;
      if (!isFinite(d) || d <= 0){
        // Algunos vídeos grabados en móvil (sobre todo iPhone) no traen la
        // duración en los metadatos cuando se cargan desde un blob: hay que
        // forzar un seek al final para que el navegador la recalcule.
        video.addEventListener('durationchange', function onDur(){
          if (isFinite(video.duration) && video.duration > 0){
            video.removeEventListener('durationchange', onDur);
            video.currentTime = 0;
            startCapture(video.duration);
          }
        });
        video.currentTime = 1e7;
      } else {
        startCapture(d);
      }
    });
  });
}

async function analyzeVideo(day, exIdx, videoId){
  const key = day + '|' + exIdx;
  const videos = state.exerciseVideos[key] || [];
  const v = videos.find(x=>x.id===videoId);
  if (!v) return;
  v.analysis = { loading:true, text:null, error:null };
  render();
  try{
    const frames = await extractVideoFrames(v.url, 3);
    if (!frames.length) throw new Error('no se pudieron extraer fotogramas');
    const content = [{
      type:'text',
      text: 'Eres un entrenador de halterofilia analizando la técnica de un levantamiento a partir de estos fotogramas ' +
        'extraídos de un vídeo, en orden temporal. Da un feedback técnico breve (máximo 6 frases, en español, en prosa, ' +
        'sin listas ni markdown) sobre postura, trayectoria de la barra, profundidad y cualquier punto de mejora que ' +
        'puedas apreciar. Si los fotogramas no dejan ver bien el levantamiento, dilo con honestidad.'
    }];
    frames.forEach(f=>{
      content.push({ type:'image', source:{ type:'base64', media_type:'image/jpeg', data:f } });
    });
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:600, messages:[{ role:'user', content }] })
    });
    if (!response.ok){
      let detail = '';
      try{ const errBody = await response.json(); detail = errBody && errBody.error && errBody.error.message ? errBody.error.message : ''; }catch(e){}
      throw new Error('respuesta ' + response.status + (detail ? (' — ' + detail) : ''));
    }
    const data = await response.json();
    const text = (data.content || []).map(b=>b.text || '').join('\n').trim();
    v.analysis = { loading:false, text: text || 'No he podido analizar el vídeo.', error:null };
  }catch(err){
    const detail = err && err.message ? err.message : 'error desconocido';
    let msg = 'No se ha podido analizar el vídeo (' + detail + ').';
    if (detail.indexOf('leer el archivo de vídeo') !== -1 || detail.indexOf('duración') !== -1){
      msg += ' Es probable que sea un .MOV grabado en HEVC de alta eficiencia (típico de iPhone), que este visor no puede decodificar. Prueba a grabar con Ajustes → Cámara → Formatos → "Más compatible", o convierte el vídeo a .mp4 (H.264) antes de subirlo.';
    } else {
      msg += ' Inténtalo de nuevo.';
    }
    v.analysis = { loading:false, text:null, error: msg };
  }
  render();
}

/* ============== INFORMES (día y semana) ==============
   Pensados como el parte que un entrenador necesitaría de un atleta que no
   entrena con él: datos concretos (qué se hizo, cuánto, cómo fue marcado,
   RPE, sensación), calculados al momento, más una frase-resumen generada
   localmente (sin depender de ningún servidor de IA, para que funcione
   igual de bien alojado fuera del entorno de Claude). */

const FEELING_ORDER = ['mal','regular','bien','muybien'];
function worstFeeling(list){
  const present = list.filter(Boolean);
  if (!present.length) return null;
  return present.reduce((worst,f)=> FEELING_ORDER.indexOf(f) < FEELING_ORDER.indexOf(worst) ? f : worst, present[0]);
}

// Combina la nota general del día con la de cada ejercicio en un único
// bloque: RPE medio, la sensación más baja de todas (para no esconder
// problemas) y el texto de cada una, indicando de qué ejercicio viene.
function dayCombinedNote(plan, day){
  const entries = (plan.days[day] || []).filter(e=>e.type==='exercise');
  const parts = [];
  const rpes = [], feelings = [];
  const general = normalizeNote(state.notes[noteKey(plan, day)]);
  if (general.text) parts.push(general.text);
  if (general.rpe!==null) rpes.push(general.rpe);
  if (general.feeling) feelings.push(general.feeling);
  entries.forEach((e, exIdx)=>{
    const n = normalizeNote(state.notes[noteKey(plan, day, exIdx)]);
    if (n.text) parts.push('[' + (e.name || ('Código '+e.code)) + '] ' + n.text);
    if (n.rpe!==null) rpes.push(n.rpe);
    if (n.feeling) feelings.push(n.feeling);
  });
  return {
    text: parts.join('\n'),
    rpe: rpes.length ? Math.round(rpes.reduce((a,b)=>a+b,0)/rpes.length) : null,
    feeling: worstFeeling(feelings)
  };
}

function dayReportData(plan, day){
  const noteObj = dayCombinedNote(plan, day);
  const entries = (plan.days[day] || []).filter(e=>e.type==='exercise');
  const exLines = entries.map((e, exIdx)=>{
    const setsStr = e.sets.map((s,si)=>{
      const st = normalizeCheck(state.checks[checkKey(plan, day, exIdx, si)]);
      const info = ratingInfo(st);
      const mark = info ? info.icon : '·';
      const reps = s.repsParts ? s.repsParts.join('+') : (s.reps??'?');
      return s.kg+'kg×'+(s.series||'?')+'x'+reps+mark;
    }).join('  ');
    return { name: e.name || ('Código '+e.code), setsStr };
  });
  const totalSets = entries.reduce((a,e)=>a+e.sets.length,0);
  const okSets = entries.reduce((a,e,exIdx)=>a+e.sets.filter((s,si)=>{ const r=normalizeCheck(state.checks[checkKey(plan,day,exIdx,si)]); return r!==null && r>=4; }).length,0);
  const badSets = entries.reduce((a,e,exIdx)=>a+e.sets.filter((s,si)=>{ const r=normalizeCheck(state.checks[checkKey(plan,day,exIdx,si)]); return r!==null && r<=2; }).length,0);
  return {
    dayName: DAY_NAMES[day],
    week: plan.meta && plan.meta.week!=null ? plan.meta.week : null,
    athlete: getActiveUser().name,
    exLines, totalSets, okSets, badSets,
    completion: totalSets ? Math.round(100*okSets/totalSets) : null,
    tonnageKg: Math.round(tonnage(plan.days[day])),
    rpe: noteObj.rpe, feeling: noteObj.feeling, note: noteObj.text
  };
}

// Resumen de una línea, generado localmente a partir de los datos (sin IA).
function localDaySummary(data){
  if (data.totalSets === 0 && data.rpe===null && data.feeling===null && !data.note) return null;
  const bits = [];
  if (data.completion !== null){
    bits.push(data.completion===100 ? 'entreno completado al 100%' : ('completó ' + data.completion + '% de las series (' + data.okSets + '/' + data.totalSets + ')'));
  }
  if (data.badSets) bits.push(data.badSets + (data.badSets===1?' serie fallada':' series falladas'));
  if (data.rpe !== null) bits.push('RPE ' + data.rpe + '/10');
  if (data.feeling) bits.push('sensación ' + (feelingLabel(data.feeling)||'').replace(/^[^\s]+\s/,'').toLowerCase());
  let summary = bits.length ? (bits[0].charAt(0).toUpperCase()+bits[0].slice(1) + (bits.length>1 ? ', ' + bits.slice(1).join(', ') : '') + '.') : '';
  if (data.note) summary += (summary?' ':'') + 'Nota: "' + data.note.split('\n')[0] + (data.note.includes('\n')?'…':'') + '"';
  return summary || null;
}

function localWeekSummary(perDay){
  const withData = perDay.filter(d=>d.totalSets>0);
  if (!withData.length) return null;
  const totalOk = withData.reduce((a,d)=>a+d.okSets,0);
  const totalSets = withData.reduce((a,d)=>a+d.totalSets,0);
  const totalTon = withData.reduce((a,d)=>a+d.tonnageKg,0);
  const rpes = withData.map(d=>d.rpe).filter(r=>r!==null);
  const avgRpe = rpes.length ? Math.round(rpes.reduce((a,b)=>a+b,0)/rpes.length) : null;
  const worstDays = withData.filter(d=>d.feeling==='mal' || (d.rpe!==null && d.rpe>=9));
  let summary = withData.length + ' días entrenados, ' + totalOk + '/' + totalSets + ' series completadas (' + Math.round(100*totalOk/totalSets) + '%), ' + totalTon + 'kg de tonelaje total.';
  if (avgRpe !== null) summary += ' RPE medio de la semana: ' + avgRpe + '/10.';
  if (worstDays.length) summary += ' Días a vigilar: ' + worstDays.map(d=>d.dayName).join(', ') + '.';
  return summary;
}

function dayReportPlainText(data, memoText){
  const lines = [];
  lines.push('INFORME DE ENTRENO — ' + data.dayName + (data.week!==null ? ' · Semana '+data.week : ''));
  lines.push('Atleta: ' + data.athlete);
  lines.push('');
  if (data.exLines.length){
    lines.push('EJERCICIOS:');
    data.exLines.forEach(l=> lines.push('- ' + l.name + ': ' + l.setsStr));
  } else {
    lines.push('EJERCICIOS: sin datos registrados este día.');
  }
  lines.push('');
  lines.push('Series completadas: ' + data.okSets + '/' + data.totalSets + (data.completion!==null ? ' (' + data.completion + '%)' : '') + (data.badSets ? ' · ' + data.badSets + ' falladas' : ''));
  lines.push('Tonelaje del día: ' + data.tonnageKg + ' kg');
  lines.push('RPE (esfuerzo percibido): ' + (data.rpe!==null ? data.rpe+'/10' : 'sin registrar'));
  lines.push('Sensación general: ' + (feelingLabel(data.feeling) || 'sin registrar'));
  lines.push('Notas del atleta: ' + (data.note || '(sin notas)'));
  if (memoText){
    lines.push('');
    lines.push('RESUMEN:');
    lines.push(memoText);
  }
  return lines.join('\n');
}

function generateDayReport(plan, day){
  const data = dayReportData(plan, day);
  const summary = localDaySummary(data);
  state.dayReport = { day, planId: plan.id, data, memo: { loading:false, text: summary, error:null } };
  render();
}

function weekReportPlainText(plan, perDay, memoText){
  const lines = [];
  lines.push('INFORME SEMANAL — ' + (plan.meta && plan.meta.week!=null ? 'Semana '+plan.meta.week : plan.meta.athlete || 'Mi plan'));
  lines.push('Atleta: ' + getActiveUser().name);
  lines.push('');
  perDay.forEach(d=>{
    lines.push(d.dayName + ': ' + d.okSets + '/' + d.totalSets + ' series' + (d.completion!==null?' ('+d.completion+'%)':'') +
      ' · ' + d.tonnageKg + 'kg' +
      (d.rpe!==null ? ' · RPE '+d.rpe : '') +
      (d.feeling ? ' · ' + feelingLabel(d.feeling) : '') +
      (d.note ? ' · nota: "' + d.note + '"' : ''));
  });
  if (memoText){
    lines.push('');
    lines.push('RESUMEN DE LA SEMANA:');
    lines.push(memoText);
  }
  return lines.join('\n');
}

function generateWeekReport(plan){
  const perDay = DAY_ORDER.filter(d=>plan.days[d] && plan.days[d].length).map(d=>dayReportData(plan, d));
  const summary = localWeekSummary(perDay);
  state.weekReport = { planId: plan.id, perDay, memo: { loading:false, text: summary, error:null } };
  render();
}

/* ---- Copiar / compartir un informe (para mandarlo por email, etc.) ---- */
async function copyReportText(text, btn){
  let copied = false;
  try{
    if (navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); copied = true; }
  }catch(e){}
  if (!copied){
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      copied = true;
    }catch(e){}
  }
  if (btn){
    btn.textContent = copied ? '✓ Copiado' : 'No se pudo copiar';
    setTimeout(()=>{ btn.textContent = '📋 Copiar texto'; }, 2000);
  }
}
async function shareReportText(subject, text){
  if (navigator.share){
    try{ await navigator.share({ title: subject, text }); return; }catch(e){ /* cancelado o no soportado */ }
  }
  window.open('mailto:?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(text), '_blank');
}

function reportActionsRow(subject, text){
  const row = el('div');
  row.style.cssText = 'display:flex;gap:8px;margin-top:16px;';
  const copyBtn = el('button','mark-btn ok selected','📋 Copiar texto');
  copyBtn.style.flex = '1';
  copyBtn.onclick = ()=> copyReportText(text, copyBtn);
  const shareBtn = el('button','mark-btn','📤 Enviar / Compartir');
  shareBtn.style.flex = '1';
  shareBtn.onclick = ()=> shareReportText(subject, text);
  row.appendChild(copyBtn); row.appendChild(shareBtn);
  return row;
}

function reportDataBlock(data){
  const wrap = el('div');
  wrap.style.cssText = 'font-family:IBM Plex Mono,monospace;font-size:12.5px;line-height:1.7;color:var(--chalk);background:var(--surface-2);border-radius:10px;padding:12px 14px;';
  const line = (label, value)=>{
    const l = el('div');
    l.innerHTML = '<span style="color:var(--muted-2);">'+label+'</span> ' + value;
    return l;
  };
  if (data.exLines.length){
    data.exLines.forEach(l=> wrap.appendChild(line('•', '<b>'+l.name+'</b>: '+l.setsStr)));
    wrap.appendChild(document.createElement('hr')).style.cssText = 'border:none;border-top:1px solid var(--surface-3);margin:8px 0;';
  } else {
    wrap.appendChild(line('•', 'Sin ejercicios registrados este día.'));
  }
  wrap.appendChild(line('Series:', data.okSets+'/'+data.totalSets + (data.completion!==null?' ('+data.completion+'%)':'') + (data.badSets?' · '+data.badSets+' malas':'')));
  wrap.appendChild(line('Tonelaje:', data.tonnageKg+' kg'));
  wrap.appendChild(line('RPE:', data.rpe!==null ? data.rpe+'/10' : '—'));
  wrap.appendChild(line('Sensación:', feelingLabel(data.feeling) || '—'));
  wrap.appendChild(line('Nota:', data.note || '—'));
  return wrap;
}

function renderDayReportOverlay(){
  const overlay = el('div','overlay');
  const close = ()=>{ state.dayReport = null; render(); };
  overlay.onclick = (e)=>{ if (e.target===overlay) close(); };
  const sheet = el('div','sheet');
  const r = state.dayReport;
  sheet.appendChild(el('h3','Informe de ' + DAY_NAMES[r.day]));
  sheet.appendChild(reportDataBlock(r.data));

  const memoWrap = el('div');
  memoWrap.style.cssText = 'margin-top:14px;';
  if (r.memo.loading){
    memoWrap.appendChild(el('div','ex-hint','Generando memo…'));
  } else if (r.memo.error){
    const err = el('div', null, r.memo.error);
    err.style.cssText = 'color:var(--red);font-size:12.5px;line-height:1.5;';
    memoWrap.appendChild(err);
  } else if (r.memo.text){
    memoWrap.appendChild(el('div','day-count','RESUMEN'));
    const txt = el('div', null, r.memo.text);
    txt.style.cssText = 'font-size:13.5px;line-height:1.6;color:var(--chalk);white-space:pre-wrap;margin-top:6px;';
    memoWrap.appendChild(txt);
  }
  sheet.appendChild(memoWrap);

  const subject = 'Entreno ' + DAY_NAMES[r.day] + (r.data.week!==null?' · Semana '+r.data.week:'') + ' — ' + r.data.athlete;
  sheet.appendChild(reportActionsRow(subject, dayReportPlainText(r.data, r.memo.text)));

  const closeBtn = el('button','sheet-close','Cerrar');
  closeBtn.onclick = close;
  sheet.appendChild(closeBtn);
  overlay.appendChild(sheet);
  return overlay;
}

function renderWeekReportOverlay(plan){
  const overlay = el('div','overlay');
  const close = ()=>{ state.weekReport = null; render(); };
  overlay.onclick = (e)=>{ if (e.target===overlay) close(); };
  const sheet = el('div','sheet');
  const r = state.weekReport;
  sheet.appendChild(el('h3','Informe de la semana'));

  r.perDay.forEach(d=>{
    const dCard = el('div');
    dCard.style.cssText = 'margin-bottom:10px;';
    dCard.appendChild(el('div','day-count', d.dayName.toUpperCase()));
    dCard.appendChild(reportDataBlock(d));
    sheet.appendChild(dCard);
  });
  if (!r.perDay.length){
    sheet.appendChild(el('div','empty-day','Sin datos esta semana.'));
  }

  const memoWrap = el('div');
  memoWrap.style.cssText = 'margin-top:6px;';
  if (r.memo.loading){
    memoWrap.appendChild(el('div','ex-hint','Generando resumen…'));
  } else if (r.memo.error){
    const err = el('div', null, r.memo.error);
    err.style.cssText = 'color:var(--red);font-size:12.5px;line-height:1.5;';
    memoWrap.appendChild(err);
  } else if (r.memo.text){
    memoWrap.appendChild(el('div','day-count','RESUMEN DE LA SEMANA'));
    const txt = el('div', null, r.memo.text);
    txt.style.cssText = 'font-size:13.5px;line-height:1.6;color:var(--chalk);white-space:pre-wrap;margin-top:6px;';
    memoWrap.appendChild(txt);
  }
  sheet.appendChild(memoWrap);

  const subject = 'Informe semanal' + (plan.meta && plan.meta.week!=null ? ' · Semana '+plan.meta.week : '') + ' — ' + getActiveUser().name;
  sheet.appendChild(reportActionsRow(subject, weekReportPlainText(plan, r.perDay, r.memo.text)));

  const closeBtn = el('button','sheet-close','Cerrar');
  closeBtn.onclick = close;
  sheet.appendChild(closeBtn);
  overlay.appendChild(sheet);
  return overlay;
}

initApp();
